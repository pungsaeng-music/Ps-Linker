  <!-- 다크 모드 & 리퀴드 글래스·틴트 초기 깜빡임(FOUC) 방지 -->
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var saved = localStorage.getItem('ps_linker_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          root.classList.add('dark');
        }

        var TINT_MAP = {
          none: [255, 255, 255],
          teal: [20, 184, 166],
          ocean: [59, 130, 246],
          lavender: [168, 85, 247],
          rose: [244, 63, 94],
          amber: [245, 158, 11],
          emerald: [16, 185, 129]
        };

        var densityRaw = localStorage.getItem('ps_linker_glass_density');
        var density = densityRaw !== null ? Math.max(0, Math.min(100, Number(densityRaw))) : 65;
        var tintPreset = localStorage.getItem('ps_linker_tint_preset') || 'teal';
        var tintCustom = localStorage.getItem('ps_linker_tint_custom') || '#14b8a6';
        var tintStrengthRaw = localStorage.getItem('ps_linker_tint_strength');
        var tintStrength = tintStrengthRaw !== null ? Math.max(0, Math.min(100, Number(tintStrengthRaw))) : 22;

        var rgb = [20, 184, 166];
        if (tintPreset === 'custom' && /^#[0-9a-fA-F]{6}$/.test(tintCustom)) {
          rgb = [
            parseInt(tintCustom.slice(1, 3), 16),
            parseInt(tintCustom.slice(3, 5), 16),
            parseInt(tintCustom.slice(5, 7), 16)
          ];
        } else if (TINT_MAP[tintPreset]) {
          rgb = TINT_MAP[tintPreset];
        }

        var d = density / 100;
        var effectiveTintAlpha = tintPreset === 'none' ? 0 : (tintStrength / 100) * 0.34;
        if (d > 0) root.classList.add('liquid-glass');

        root.style.setProperty('--lg-density', d.toFixed(2));
        root.style.setProperty('--lg-blur', Math.round(d * 28) + 'px');
        root.style.setProperty('--lg-saturate', Math.round(100 + d * 95) + '%');
        root.style.setProperty('--lg-surface-alpha', (0.98 - d * 0.32).toFixed(3));
        root.style.setProperty('--lg-card-alpha', (0.99 - d * 0.29).toFixed(3));
        root.style.setProperty('--lg-modal-alpha', (0.99 - d * 0.18).toFixed(3));
        root.style.setProperty('--lg-sheen-alpha', (d * 0.45).toFixed(3));
        root.style.setProperty('--lg-tint-r', String(rgb[0]));
        root.style.setProperty('--lg-tint-g', String(rgb[1]));
        root.style.setProperty('--lg-tint-b', String(rgb[2]));
        root.style.setProperty('--lg-tint-alpha', effectiveTintAlpha.toFixed(3));
      } catch (e) {}
    })();
  </script>

    function captureTriggerOrigin(e) {
      try {
        if (e && e.currentTarget && typeof e.currentTarget.getBoundingClientRect === 'function') {
          const rect = e.currentTarget.getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0) {
            return {
              x: rect.left + rect.width / 2,
              y: rect.top + rect.height / 2,
              top: rect.top,
              bottom: rect.bottom,
              left: rect.left,
              right: rect.right
            };
          }
        }
        if (e && e.touches && e.touches[0]) {
          const t = e.touches[0];
          return { x: t.clientX, y: t.clientY, top: t.clientY, bottom: t.clientY, left: t.clientX, right: t.clientX };
        }
        if (e && typeof e.clientX === 'number' && typeof e.clientY === 'number' && (e.clientX > 0 || e.clientY > 0)) {
          return { x: e.clientX, y: e.clientY, top: e.clientY, bottom: e.clientY, left: e.clientX, right: e.clientX };
        }
      } catch {}
      return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    }

    // 누른 위치에서 스프링 애니메이션으로 펼쳐지는 PC·모바일 겸용 앵커 팝오버 컴포넌트
    function OriginPopup({ isOpen, onClose, origin, maxWidthClass = 'max-w-sm', borderClass = 'border-slate-200', zIndexClass = 'z-50', children }) {
      const boxRef = useRef(null);
      const [entered, setEntered] = useState(false);

      useEffect(() => {
        if (!isOpen) setEntered(false);
      }, [isOpen]);

      useLayoutEffect(() => {
        if (!isOpen || !boxRef.current) return;
        const el = boxRef.current;

        const updatePosition = () => {
          if (!boxRef.current) return;
          const vv = window.visualViewport;
          const vw = vv ? vv.width : window.innerWidth;
          const vh = vv ? vv.height : window.innerHeight;
          const offsetTop = vv ? vv.offsetTop : 0;

          const shellEl = document.querySelector('.lg-shell');
          const shellRect = shellEl ? shellEl.getBoundingClientRect() : null;
          const useShellBounds = shellRect && shellRect.width > 240 && origin && origin.x >= shellRect.left - 8 && origin.x <= shellRect.right + 8;

          const boundLeft = useShellBounds ? Math.max(12, shellRect.left + 12) : 12;
          const boundRight = useShellBounds ? Math.min(vw - 12, shellRect.right - 12) : (vw - 12);
          const availWidth = Math.max(240, boundRight - boundLeft);

          el.style.maxWidth = `${availWidth}px`;

          const w = Math.min(el.offsetWidth || 320, availWidth);
          const h = el.offsetHeight || 260;

          const ox = origin && typeof origin.x === 'number' ? origin.x : (boundLeft + boundRight) / 2;
          const oy = origin && typeof origin.y === 'number' ? origin.y : vh / 2;
          const oTop = origin && typeof origin.top === 'number' ? origin.top : oy;
          const oBottom = origin && typeof origin.bottom === 'number' ? origin.bottom : oy;

          const left = Math.max(boundLeft, Math.min(boundRight - w, ox - w / 2));

          let top;
          if (oBottom + 8 + h <= offsetTop + vh - 12) {
            top = oBottom + 8;
          } else if (oTop - 8 - h >= offsetTop + 12) {
            top = oTop - 8 - h;
          } else {
            top = Math.max(offsetTop + 12, Math.min(offsetTop + vh - h - 12, oy - h / 2));
          }

          const originRelX = Math.max(16, Math.min(w - 16, ox - left));
          const originRelY = Math.max(16, Math.min(h - 16, oy - top));

          el.style.left = `${left}px`;
          el.style.top = `${top}px`;
          el.style.transformOrigin = `${originRelX}px ${originRelY}px`;
        };

        updatePosition();
        const raf = requestAnimationFrame(() => setEntered(true));

        window.addEventListener('resize', updatePosition);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', updatePosition);
        }
        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener('resize', updatePosition);
          if (window.visualViewport) {
            window.visualViewport.removeEventListener('resize', updatePosition);
          }
        };
      }, [isOpen, origin]);

      if (!isOpen) return null;

      return ReactDOM.createPortal(
        <div className={`fixed inset-0 ${zIndexClass}`}>
          <div
            onClick={onClose}
            className={`fixed inset-0 bg-black/45 backdrop-blur-[2px] transition-opacity duration-200 ${entered ? 'opacity-100' : 'opacity-0'}`}
          />
          <div
            ref={boxRef}
            onClick={(e) => e.stopPropagation()}
            style={{

          >
            {children}
          </div>
        </div>,
        document.body
      );
    }

          'ㅂㅕㅇㅅㅣㄴ', 'ㅂㅕㅇㅅㄴ', 'ㅅㅣㅂㅏㄹ', 'ㅆㅣㅂㅏㄹ', 'ㅅㅂㅏㄹ',
          'ㅈㅗㄴㄴㅏ', 'ㄱㅐㅅㅐㄲㅣ', 'ㄱㅐㅅㅐ', 'ㅈㅣㄹㅏㄹ', 'ㄴㅡㄱㅡㅁㅁㅏ',
          'ㄴㅣㅇㅓㅁㅁㅏ', 'ㅇㅔㅁㅊㅏㅇ', 'ㅈㅗㅈㄱㅏㅌ', 'ㅅㅔㄱㅅㅡ', 'ㅂㅗㅈㅣ', 'ㅈㅏㅈㅣ'
        ];
        jamoTargets.forEach(jt => {
          if (jamo.includes(jt) || this.findBoundedSubsequence(jamo, jt, 3)) {
            isFiltered = true;
            if (!reasons.includes(`자모 분해/기호 우회 욕설('${jt}')`)) {
              reasons.push(`자모 분해/기호 우회 욕설('${jt}')`);
            }
          }
        });

        const standaloneChosungTargets = ['ㅂㅅ', 'ㅅㅂ', 'ㅆㅂ', 'ㅈㄴ', 'ㄱㅅㄲ', 'ㅈㄹ', 'ㄲㅈ', 'ㄴㅇㅁ', 'ㄴㄱㅁ'];
        standaloneChosungTargets.forEach(ct => {
          if (stripped.includes(ct) || this.findBoundedSubsequence(stripped, ct, 2)) {
            isFiltered = true;
            if (!reasons.includes(`초성 우회 욕설('${ct}')`)) {
              reasons.push(`초성 우회 욕설('${ct}')`);
            }
          }
        });

        for (const bPat of BULLYING_CONTEXT_PATTERNS) {
          bPat.lastIndex = 0;
          const bMatch = workingText.match(bPat);
          if (bMatch) {
            isFiltered = true;
            const detail = `인신공격/괴롭힘 문맥('${bMatch[0]}')`;
            if (!reasons.includes(detail)) reasons.push(detail);
            bPat.lastIndex = 0;
            workingText = workingText.replace(bPat, (m) => '*'.repeat(m.length));
          }
        }

        tokenMap.forEach(({ token, word }) => {
          workingText = workingText.split(token).join(word);
        });

        if (isFiltered && workingText === text) {
          let fallbackMasked = String(text);
          tokenMap.forEach(({ token, word }) => {
            fallbackMasked = fallbackMasked.split(word).join(token);
          });
          fallbackMasked = fallbackMasked.replace(/(__SAFE_\d+__)|([^\s])/g, (m, safeTok) => safeTok || '*');
          tokenMap.forEach(({ token, word }) => {
            fallbackMasked = fallbackMasked.split(token).join(word);
          });
          workingText = fallbackMasked;
        }

        return {
          cleanText: workingText,
          isFiltered,
          foundWords,
          aiReason: reasons.join(', ') || 'AI 유해 표현 감지'
        };
      },

      analyzeImagePixels(img) {
        try {
          const probeCanvas = document.createElement('canvas');
          const size = 96;
          probeCanvas.width = size;
          probeCanvas.height = size;
          const pCtx = probeCanvas.getContext('2d');
          pCtx.drawImage(img, 0, 0, size, size);
          const { data } = pCtx.getImageData(0, 0, size, size);

          let skinPixels = 0;
          let bloodPixels = 0;
          let calPixels = 0;
          const total = size * size;
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i + 1], b = data[i + 2];
            if (r > 200 && g < 50 && b > 200) calPixels++;
            const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
            const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
            if (r > 95 && g > 40 && b > 20 && r > g && r > b && Math.abs(r - g) > 15 && cr >= 133 && cr <= 173 && cb >= 77 && cb <= 127) {
              skinPixels++;
            }
            if (r > 130 && g < 45 && b < 45 && r > g * 2.8 && r > b * 2.8) {
              bloodPixels++;
            }
          }
          return {
            isTestSignature: calPixels >= 10,
            skinRatio: skinPixels / total,
            bloodRatio: bloodPixels / total
          };
        } catch (e) {
          return { isTestSignature: false, skinRatio: 0, bloodRatio: 0 };
        }
      },

      compressImageSmart(img, maxDim = 640, targetBytes = 120 * 1024) {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          }
        } else {
          if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        let quality = 0.78;
        let dataUrl = canvas.toDataURL('image/jpeg', quality);
        while (dataUrl.length * 0.75 > targetBytes && quality > 0.38) {
          quality -= 0.1;
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        return dataUrl;
      }
    };

    function calculateRemainingTime(lastMessageAt, categoryKey) {
      if (!lastMessageAt) return { text: '⏱️ 기한 없음', isExpired: false };
      const cat = CATEGORIES[categoryKey] || CATEGORIES.STUDY;
      const limitMs = cat.limitHours * 3600 * 1000;
      const diffMs = (lastMessageAt + limitMs) - Date.now();

      if (diffMs <= 0) return { text: '💥 폭파됨', isExpired: true };

      const hours = Math.floor(diffMs / (3600 * 1000));
      const mins = Math.floor((diffMs % (3600 * 1000)) / (60 * 1000));
      return { text: `⏱️ ${hours}시간 ${mins}분 후 폭파 예정`, isExpired: false };
    }

    function calculateDDayLabel(targetDateStr) {
      if (!targetDateStr) return 'D-?';
      const now = new Date();
      const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const parts = targetDateStr.split('-').map(Number);
      if (parts.length !== 3) return 'D-?';
      const targetMidnight = new Date(parts[0], parts[1] - 1, parts[2]);
      const diffDays = Math.round((targetMidnight - todayMidnight) / (1000 * 60 * 60 * 24));
      if (diffDays === 0) return 'D-DAY';
      if (diffDays > 0) return `D-${diffDays}`;
      return `D+${Math.abs(diffDays)}`;
    }

    function hexToRgbArray(hex) {
      if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return [20, 184, 166];
      return [
        parseInt(hex.slice(1, 3), 16),
        parseInt(hex.slice(3, 5), 16),
        parseInt(hex.slice(5, 7), 16)
      ];
    }

    function renderFormattedText(text) {
      if (!text) return null;
      const str = String(text);
      const codeBlockParts = str.split(/(```[\s\S]*?```)/g);
      return codeBlockParts.map((part, idx) => {
        if (part.startsWith('```') && part.endsWith('```')) {
          const inner = part.replace(/^```[a-zA-Z0-9_-]*\n?/, '').replace(/```$/, '');
          return (
            <pre key={idx} className="my-1.5 p-2.5 rounded-xl bg-slate-900 text-teal-200 font-mono text-[11px] overflow-x-auto border border-slate-700 leading-snug">
              <code>{inner}</code>
            </pre>
          );
        }
        const mathParts = part.split(/(\$[^$\n]+\$)/g);
        return (
          <span key={idx} className="whitespace-pre-wrap break-words">
            {mathParts.map((seg, sIdx) => {
              if (seg.startsWith('$') && seg.endsWith('$') && seg.length > 2) {
                return (
                  <code key={sIdx} className="px-1.5 py-0.5 mx-0.5 rounded bg-black/10 font-mono text-[11px] font-bold">
                    {seg.slice(1, -1)}
                  </code>
                );
              }
              return <React.Fragment key={sIdx}>{seg}</React.Fragment>;
            })}
          </span>
        );
      });
    }

      // NEIS 급식 & 학사일정 조회
      const fetchPoongsaengNeisMeals = useCallback(async (overrideKey = null) => {
        setMealLoading(true);
        try {
          const now = new Date();
          const formatYmd = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
          const todayYmd = formatYmd(now);
          const futureDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 180);
          const endYmd = formatYmd(futureDate);
          const keyParam = (overrideKey !== null ? overrideKey : neisApiKey).trim();
          const keyQuery = keyParam ? `&KEY=${encodeURIComponent(keyParam)}` : '';
          let schulCode = '7530105';
          try {
            const schoolRes = await fetch(`https://open.neis.go.kr/hub/schoolInfo?Type=json&ATPT_OFCDC_SC_CODE=J10&SCHUL_NM=${encodeURIComponent('풍생고등학교')}${keyQuery}`);
            const schoolJson = await schoolRes.json();
            const row = schoolJson?.schoolInfo?.[1]?.row?.[0];
            if (row?.SD_SCHUL_CODE) schulCode = row.SD_SCHUL_CODE;
          } catch {}

          const mealRes = await fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=J10&SD_SCHUL_CODE=${schulCode}&MLSV_YMD=${todayYmd}${keyQuery}`);
          const mealJson = await mealRes.json();
          const rows = mealJson?.mealServiceDietInfo?.[1]?.row;
          if (Array.isArray(rows) && rows.length > 0) {
            const cleanDishList = (rawDish) => String(rawDish || '').split(/<br\s*\/?>/gi).map(item => item.replace(/\([0-9.]+\)/g, '').trim()).filter(Boolean);
            const lunchRow = rows.find(r => r.MMEAL_SC_CODE === '2');
            const dinnerRow = rows.find(r => r.MMEAL_SC_CODE === '3');
            setTodayMeals({
              lunch: lunchRow ? { menu: cleanDishList(lunchRow.DDISH_NM), cal: lunchRow.CAL_INFO || '' } : { menu: ['오늘 중식 정보가 없습니다.'], cal: '' },
              dinner: dinnerRow ? { menu: cleanDishList(dinnerRow.DDISH_NM), cal: dinnerRow.CAL_INFO || '' } : { menu: ['오늘 석식 정보가 없습니다.'], cal: '' }
            });
            setMealStatusBadge('NEIS 실시간 연동');
          } else {
            setTodayMeals(DEFAULT_FALLBACK_MEALS);
            setMealStatusBadge('주말·휴일 기본식단');
          }

          try {
            const schedRes = await fetch(`https://open.neis.go.kr/hub/SchoolSchedule?Type=json&ATPT_OFCDC_SC_CODE=J10&SD_SCHUL_CODE=${schulCode}&AA_FROM_YMD=${todayYmd}&AA_TO_YMD=${endYmd}&pSize=100${keyQuery}`);
            const schedJson = await schedRes.json();
            const schedRows = schedJson?.SchoolSchedule?.[1]?.row;
            if (Array.isArray(schedRows) && schedRows.length > 0) {
              const ignoreNames = ['토요휴업일', '일요일', '공휴일'];
              const sortedRows = [...schedRows].sort((a, b) => String(a.AA_YMD).localeCompare(String(b.AA_YMD)));
              const eventMap = new Map();
              sortedRows.forEach(r => {
                const name = String(r.EVENT_NM || '').trim();
                const ymd = String(r.AA_YMD || '').trim();
                if (!name || ymd.length !== 8 || ignoreNames.some(ig => name.includes(ig))) return;
                if (!eventMap.has(name)) {
                  const formattedDate = `${ymd.slice(0, 4)}-${ymd.slice(4, 6)}-${ymd.slice(6, 8)}`;
                  eventMap.set(name, { id: `neis-${ymd}-${name}`, title: name, targetDate: formattedDate });
                }
              });
              const allUpcoming = Array.from(eventMap.values());
              const priorityKeywords = ['고사', '평가', '방학', '개학', '모의', '수능', '학력평가', '축제', '체육', '졸업', '입학', '수련', '수학여행', '현장체험'];
              const majorEvents = allUpcoming.filter(ev => priorityKeywords.some(kw => ev.title.includes(kw)));
              const fallbackEvents = allUpcoming.filter(ev => !priorityKeywords.some(kw => ev.title.includes(kw)));
              const autoDdays = [...majorEvents, ...fallbackEvents].slice(0, 4);
              if (autoDdays.length > 0) {
                setDdayList(autoDdays);
                try { localStorage.setItem('ps_linker_ddays', JSON.stringify(autoDdays)); } catch {}
              }
            }
          } catch {}
        } catch {
          setTodayMeals(DEFAULT_FALLBACK_MEALS);
          setMealStatusBadge('기본 식단 표시');
        } finally {
          setMealLoading(false);
        }

      const handleSelfWithdraw = () => {
        if (!currentUser) return;

          triggerToast('🛡️ 총괄 관리자 계정은 시스템 보호를 위해 탈퇴할 수 없습니다.', 'warning');

      };

      // 1회용 사진 열람 (5초 제한 + 캡쳐 차단)
      const handleOpenOnceImage = (msg) => {
        if (!msg || !msg.image) return;
        const userKey = (currentUser?.id || 'user').replace(/[.#$\[\]]/g, '_');
        const alreadyViewed = Boolean(localViewedOnceIds[msg.id] || (msg.viewedBy && msg.viewedBy[userKey]));
        if (alreadyViewed) {
          triggerToast('💨 이미 열람한 1회용 사진입니다. 다시 볼 수 없습니다.', 'warning');
          return;
        }

        const viewedAt = Date.now();
        setOnceCaptureBlocked(false);
        setOnceTimeLeftMs(5000);
        setViewingOnceMsg(msg);
        setLocalViewedOnceIds(prev => {
          const next = { ...prev, [msg.id]: viewedAt };
          try { localStorage.setItem('ps_linker_viewed_once', JSON.stringify(next)); } catch {}
          return next;

      useEffect(() => {
        if (!viewingOnceMsg) return;

        const DURATION_MS = 5000;
        const deadline = Date.now() + DURATION_MS;
        let closed = false;

        const timerId = setInterval(() => {
          const rem = Math.max(0, deadline - Date.now());
          setOnceTimeLeftMs(rem);
          if (rem <= 0 && !closed) {
            closed = true;
            clearInterval(timerId);
            setViewingOnceMsg(null);
            setOnceCaptureBlocked(false);
            triggerToast('⏱️ 5초 열람 시간이 만료되어 사진이 영구 잠금되었습니다.', 'warning');
          }
        }, 50);

        const triggerCaptureBlock = () => {
          if (closed) return;
          closed = true;
          clearInterval(timerId);
          setOnceCaptureBlocked(true);
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText('보안 정책에 의해 캡쳐가 차단되었습니다.').catch(() => {});
            }
          } catch {}
          setTimeout(() => {
            setViewingOnceMsg(null);
            setOnceCaptureBlocked(false);
            triggerToast('🚨 캡쳐 또는 화면 이탈 시도가 감지되어 1회용 사진이 즉시 파기되었습니다.', 'danger');
          }, 900);
        };

        const handleBlur = () => triggerCaptureBlock();
        const handleVisibilityChange = () => { if (document.hidden) triggerCaptureBlock(); };
        const handlePageHide = () => triggerCaptureBlock();
        const handleKeyEvent = (e) => {
          const key = (e.key || '').toLowerCase();
          const isScreenshotKey =
            e.key === 'PrintScreen' ||
            e.keyCode === 44 ||
            ((e.metaKey || e.ctrlKey) && e.shiftKey && ['3', '4', '5', 's', 'i'].includes(key)) ||
            ((e.metaKey || e.ctrlKey) && ['p', 's', 'u'].includes(key)) ||
            e.key === 'F12';

          if (isScreenshotKey) {
            e.preventDefault();
            e.stopPropagation();
            triggerCaptureBlock();
          }
        };

        window.addEventListener('blur', handleBlur);
        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('pagehide', handlePageHide);
        window.addEventListener('keydown', handleKeyEvent, true);
        window.addEventListener('keyup', handleKeyEvent, true);

        return () => {
          closed = true;
          clearInterval(timerId);
          window.removeEventListener('blur', handleBlur);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          window.removeEventListener('pagehide', handlePageHide);
          window.removeEventListener('keydown', handleKeyEvent, true);
          window.removeEventListener('keyup', handleKeyEvent, true);
        };

        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const img = new Image();
        img.onload = () => {
          const maxW = 720;
          const maxH = 720;
          let w = img.width || 480;
          let h = img.height || 480;
          const scale = Math.min(1, maxW / w, maxH / h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);

          canvas.width = w;
          canvas.height = h;
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);

          ctx.save();
          ctx.translate(w / 2, h / 2);
          ctx.rotate(-Math.PI / 6);
          ctx.font = 'bold 14px Pretendard, sans-serif';
          ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.28)';

              } catch {}
            }

            const compressedDataUrl = SecurityEngine.compressImageSmart(img, 640, 120 * 1024);
            onSuccess(compressedDataUrl);
            triggerToast('🛡️ AI 비전 스캔 통과 및 경량 압축 완료!', 'success');
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleSendMessage = async (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (isComposingRef.current) return;

        const rawText = chatInputText.trim();
        if (!rawText && !chatSelectedImage) return;

        const now = Date.now();
        if (rawText && lastSentRef.current.text === rawText && now - lastSentRef.current.time < 500) {
          return;
        }

        const { isBanned, timeText } = checkUserBanned();
        if (isBanned) {
          triggerToast(`⛔ 채팅이 차단된 계정입니다. (남은 차단 시간: ${timeText})`, 'danger');
          return;
        }

        let finalText = rawText;
        if (rawText) {
          const filterRes = SecurityEngine.filterText(rawText);
          if (filterRes.isFiltered) {
            recordAiSecurityLog('TEXT_FILTER', filterRes.aiReason, rawText, activeRoom?.title || '대화방');
            triggerToast('부적절한 언어 탐지', 'danger');
            return;
          }

          const recentShortMsgs = roomMessages
            .filter(m => !m.isSystem && (m.senderId === currentUser.id || m.sender === currentUser.nickname) && (now - (m.timestamp || 0) <= 45000) && (m.text || '').trim().length <= 4)
            .slice(-3);

          if (recentShortMsgs.length > 0 && rawText.length <= 6) {
            const combinedText = recentShortMsgs.map(m => (m.text || '').trim()).join('') + rawText;
            const splitCheck = SecurityEngine.filterText(combinedText);
            if (splitCheck.isFiltered) {
              recordAiSecurityLog('SPLIT_EVASION', `연속 분할 욕설 우회 차단 (${splitCheck.aiReason})`, combinedText, activeRoom?.title || '대화방');
              recentShortMsgs.forEach(oldMsg => {
                const masked = '*'.repeat((oldMsg.text || '').length || 1);
                if (firebaseDb && activeRoomId) {
                  firebaseDb.ref(`roomMessages/${activeRoomId}/${oldMsg.id}/text`).set(masked).catch(() => {});
                }
              });
              setRoomMessages(prev => prev.map(m =>
                recentShortMsgs.some(rm => rm.id === m.id) ? { ...m, text: '*'.repeat((m.text || '').length || 1) } : m
              ));
              setChatInputText('');
              triggerToast('부적절한 언어 탐지', 'danger');
              return;
            }
          }
          finalText = filterRes.cleanText;
        }

        lastSentRef.current = { text: rawText, time: now };
        const msgId = `m-${now}-${Math.random().toString(36).substring(2, 6)}`;
        const newMsg = {
          id: msgId,
          roomId: activeRoomId,
          senderId: currentUser.id,
          sender: currentUser.nickname,
          text: finalText,
          image: chatSelectedImage || null,
          imageViewMode: chatSelectedImage ? imageViewMode : null,
          timestamp: now,
          isSystem: false
        };

        setChatInputText('');
        setChatSelectedImage(null);
        setImageViewMode('always');

        if (firebaseDb && activeRoomId) {
          firebaseDb.ref(`roomMessages/${activeRoomId}/${msgId}`).set(newMsg).catch(() => {});
          firebaseDb.ref(`rooms/${activeRoomId}/lastMessageAt`).set(now).catch(() => {});
        } else {
          setRoomMessages(prev => [...prev, newMsg]);
          setRooms(prev => prev.map(r => r.id === activeRoomId ? { ...r, lastMessageAt: now } : r));
        }

        if (geminiApiKey && finalText.length >= 4) {
          try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(geminiApiKey)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [{
                    text: `다음 한국 고등학생 채팅 메시지에 실명 저격, 심각한 따돌림, 자해 유도, 성희롱 문맥이 있으면 "TOXIC:사유"로만 답하고, 정상이면 "SAFE"로만 답하세요.\n메시지: "${finalText}"`
                  }]
                }]
              })
            });
            const data = await resp.json();
            const verdict = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
            if (verdict.startsWith('TOXIC')) {
              const reason = verdict.replace(/^TOXIC:?/, '').trim() || 'LLM 문맥 유해 판정';
              recordAiSecurityLog('LLM_CONTEXT', reason, finalText, activeRoom?.title || '대화방');
              const blinded = '🚫 [AI 문맥 보안관에 의해 블라인드 처리된 메시지입니다]';
              if (firebaseDb && activeRoomId) {
                firebaseDb.ref(`roomMessages/${activeRoomId}/${msgId}/text`).set(blinded).catch(() => {});
              }
              setRoomMessages(prev => prev.map(m => m.id === msgId ? { ...m, text: blinded } : m));
              triggerToast('부적절한 언어 탐지', 'danger');
            }
          } catch {}
        }
      };

      const handleProfileRating = (delta, reason) => {
        if (!targetProfileUser || !currentUser) return;
        if (targetProfileUser.id === currentUser.id) {
          triggerToast('⚠️ 자기 자신의 매너 온도는 평가할 수 없습니다.', 'warning');
          return;
        }

        const cooldownKey = `${currentUser.id}__${targetProfileUser.id}`;
        const COOLDOWN_MS = 24 * 3600 * 1000;
        const lastEvalLocal = evaluationCooldowns[cooldownKey] || 0;
        const recentLog = mannerLogs.find(
          m => m.evaluatorId === currentUser.id && m.targetId === targetProfileUser.id && (Date.now() - (m.timestamp || 0) < COOLDOWN_MS)
        );
        const lastEvalTime = Math.max(lastEvalLocal, recentLog?.timestamp || 0);

        if (lastEvalTime && (Date.now() - lastEvalTime < COOLDOWN_MS)) {
          const remMs = COOLDOWN_MS - (Date.now() - lastEvalTime);
          const remHours = Math.floor(remMs / (3600 * 1000));
          const remMins = Math.max(1, Math.floor((remMs % (3600 * 1000)) / (60 * 1000)));
          triggerToast(`⏱️ 동일 학우에게는 24시간에 1회만 평가할 수 있습니다. (남은 시간: ${remHours}시간 ${remMins}분)`, 'warning');
          return;
        }

        const currentTemp = Number(targetProfileUser.temperature ?? 36.5);
        const nextTemp = Math.max(0, Math.min(99.9, Math.round((currentTemp + delta) * 10) / 10));
        const existingBadges = Array.isArray(targetProfileUser.badges) ? [...targetProfileUser.badges] : [];

        if (nextTemp >= 40.0 && !existingBadges.some(b => b.id === 'b2')) {
          existingBadges.push({ id: 'b2', name: '열정 멘토', emoji: '🔥', desc: '온도 40.0℃ 달성' });
        }
        if (nextTemp >= 45.0 && !existingBadges.some(b => b.id === 'b4')) {
          existingBadges.push({ id: 'b4', name: '풍생 수호신', emoji: '👑', desc: '온도 45.0℃ 이상 달성' });
        }

        if (firebaseDb) {
          firebaseDb.ref(`publicUsers/${targetProfileUser.id}`).update({
            temperature: nextTemp,
            badges: existingBadges
          }).catch(() => {});
        }

        setPublicUserList(prev => prev.map(u =>
          u.id === targetProfileUser.id ? { ...u, temperature: nextTemp, badges: existingBadges } : u
        ));
        setTargetProfileUser(prev => prev ? { ...prev, temperature: nextTemp, badges: existingBadges } : null);

        const now = Date.now();
        setEvaluationCooldowns(prev => ({ ...prev, [cooldownKey]: now }));

        appendMannerAuditLog({
          id: `mlog-${now}-${Math.random().toString(36).substring(2, 6)}`,
          evaluatorId: currentUser.id,
          evaluatorNick: currentUser.nickname,
          targetId: targetProfileUser.id,
          targetNick: targetProfileUser.nickname,
          delta,
          reason,
          contextRoom: activeRoom?.title || '학우 프로필 평가',
          timestamp: now,
          appealStatus: 'none'
        });

        triggerToast(`🌡️ ${targetProfileUser.nickname}님의 매너 온도가 ${nextTemp.toFixed(1)}℃로 반영되었습니다!`, delta > 0 ? 'success' : 'info');
      };

                      📬 웹메일 수신함 열기

                    <button type="submit" className="flex-1 py-3 bg-teal-600 hover:bg-teal-700 text-white font-extrabold rounded-2xl text-xs shadow transition">
                      인증 확인

              )}

              {authStep === 3 && (

                    ✅ 이메일 인증 완료! 사용할 닉네임과 본명을 정해 주세요.
                  </div>

                  <div className="space-y-1">
                    <label className="block text-xs font-extrabold text-slate-700">사용할 익명 닉네임</label>
                    <input 
                      type="text" 
                      value={authNickname}

                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-3 text-xs text-slate-900 font-bold focus:outline-none focus:border-teal-600"

                  <div className="space-y-1">

                      <span>실명 / 본명</span>
                      <span className="text-[10px] text-rose-500 font-bold">🔒 privateUsers 격리 저장</span>
                    </label>
                    <input

                      onChange={(e) => setAuthRealName(e.target.value)}
                      placeholder="예: 홍길동 (관리자 전용 DB 분리 저장)" 
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-3 text-xs text-slate-900 font-bold focus:outline-none focus:border-teal-600"

                  <button type="submit" className="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-extrabold rounded-2xl text-xs shadow-lg transition">
                    커넥션브릿지 시작하기 🌱
                  </button>

              <div className="pt-4 border-t border-slate-100 text-center">
                <button

                  className="px-3.5 py-1.5 bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 rounded-full text-[11px] font-extrabold transition shadow-sm inline-flex items-center gap-1.5"

      // =========================================================================

                            value={adminEditForm.gradeClass}

                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 font-bold"
                          >
                            {[1, 2, 3].flatMap(g =>
                              Array.from({ length: 10 }, (_, i) => `${g}학년 ${i + 1}반`)
                            ).map(cls => (
                              <option key={cls} value={cls}>{cls}</option>
                            ))}
                            <option value="교직원">교직원</option>
                          </select>
                        </div>
                        <div>
                          <label className="block font-extrabold text-slate-700 mb-1">역할 / 직책</label>
                          <select
                            value={adminEditForm.role}
                            onChange={(e) => setAdminEditForm(prev => ({ ...prev, role: e.target.value }))}
                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 font-bold"
                          >
                            <option value="학생 (기본)">학생 (기본)</option>
                            <option value="학업 멘토">학업 멘토</option>
                            <option value="SDGs 수호신">SDGs 수호신</option>
                            <option value="학생회 임원">학생회 임원</option>
                            <option value="선도부">선도부</option>
                            <option value="교내 전문상담사">교내 전문상담사</option>
                            <option value="총괄 관리자 🛡️">총괄 관리자 🛡️</option>
                          </select>
                        </div>
                      </div>

                      <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200 flex items-center justify-between">
                        <div>
                          <p className="font-extrabold text-slate-800">총괄 관리자 권한 부여</p>
                          <p className="text-[10px] text-slate-500">대시보드 접근 및 실명 원장 열람 권한</p>
                        </div>
                        <input
                          type="checkbox"
                          checked={adminEditForm.isAdmin}
                          onChange={(e) => setAdminEditForm(prev => ({ ...prev, isAdmin: e.target.checked }))}
                          className="w-4 h-4 accent-teal-600 cursor-pointer"
                        />
                      </div>

                      <div className="p-3 bg-amber-50/60 rounded-2xl border border-amber-200 space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="font-extrabold text-slate-800">🌡️ 매너 온도 설정</span>
                          <div className="flex items-center gap-1">
                            <input
                              type="number"
                              step="0.1"
                              min="0"
                              max="99.9"
                              value={adminEditForm.temperature}
                              onChange={(e) => setAdminEditForm(prev => ({ ...prev, temperature: e.target.value }))}
                              className="w-16 bg-white border border-amber-300 rounded-lg px-2 py-1 text-right font-mono font-black text-amber-700"
                            />
                            <span className="font-bold text-amber-700">℃</span>
                          </div>
                        </div>
                        <div className="grid grid-cols-5 gap-1 text-[10px] font-extrabold">
                          <button type="button" onClick={() => setAdminEditForm(p => ({ ...p, temperature: Math.max(0, Math.round((Number(p.temperature) - 5) * 10) / 10) }))} className="py-1 bg-rose-100 text-rose-800 rounded-lg">-5.0</button>
                          <button type="button" onClick={() => setAdminEditForm(p => ({ ...p, temperature: Math.max(0, Math.round((Number(p.temperature) - 1) * 10) / 10) }))} className="py-1 bg-amber-100 text-amber-800 rounded-lg">-1.0</button>
                          <button type="button" onClick={() => setAdminEditForm(p => ({ ...p, temperature: 36.5 }))} className="py-1 bg-white border border-slate-200 text-slate-700 rounded-lg">36.5℃</button>
                          <button type="button" onClick={() => setAdminEditForm(p => ({ ...p, temperature: Math.min(99.9, Math.round((Number(p.temperature) + 1) * 10) / 10) }))} className="py-1 bg-teal-100 text-teal-800 rounded-lg">+1.0</button>
                          <button type="button" onClick={() => setAdminEditForm(p => ({ ...p, temperature: Math.min(99.9, Math.round((Number(p.temperature) + 5) * 10) / 10) }))} className="py-1 bg-emerald-100 text-emerald-800 rounded-lg">+5.0</button>
                        </div>
                      </div>

                      <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                        <p className="font-extrabold text-slate-800">🏅 뱃지 수여 및 회수 (클릭하여 토글)</p>
                        <div className="grid grid-cols-2 gap-1.5">
                          {BADGE_CATALOG.map(b => {
                            const active = ownedBadges.some(ob => ob.id === b.id || ob.name.includes(b.name));
                            return (
                              <button
                                key={b.id}
                                type="button"
                                onClick={() => handleAdminToggleUserBadge(editingAdminUserId, b)}
                                className={`p-2 rounded-xl border text-left text-[10px] font-extrabold flex items-center justify-between transition ${
                                  active
                                    ? 'bg-amber-100 border-amber-400 text-amber-950 shadow-sm'
                                    : 'bg-white border-slate-200 text-slate-500 hover:border-slate-300'
                                }`}
                              >
                                <span className="truncate">{b.emoji} {b.name}</span>
                                <span className="text-[9px] shrink-0">{active ? '보유중' : '미보유'}</span>
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      <div className="p-3 bg-rose-50/70 rounded-2xl border border-rose-200 space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="font-extrabold text-rose-800">⛔ 채팅 이용 제한 (제재 기간)</span>
                          {isBanned && (
                            <span className="text-[10px] font-bold text-rose-600">
                              ~{new Date(priv.bannedUntil).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}
                            </span>
                          )}
                        </div>
                        <div className="grid grid-cols-4 gap-1 text-[10px] font-extrabold">
                          <button type="button" onClick={() => handleAdminBanUser(editingAdminUserId, 1)} className="py-1.5 bg-white border border-rose-200 text-rose-700 rounded-lg">1시간</button>
                          <button type="button" onClick={() => handleAdminBanUser(editingAdminUserId, 24)} className="py-1.5 bg-white border border-rose-200 text-rose-700 rounded-lg">24시간</button>
                          <button type="button" onClick={() => handleAdminBanUser(editingAdminUserId, 72)} className="py-1.5 bg-white border border-rose-200 text-rose-700 rounded-lg">3일</button>
                          <button type="button" onClick={() => handleAdminBanUser(editingAdminUserId, 168)} className="py-1.5 bg-white border border-rose-200 text-rose-700 rounded-lg">7일</button>
                        </div>
                        <div className="flex gap-1.5 pt-0.5">
                          {isBanned && (
                            <button
                              type="button"
                              onClick={() => handleAdminBanUser(editingAdminUserId, 0)}
                              className="flex-1 py-1.5 bg-emerald-600 text-white font-extrabold rounded-lg text-[10px]"
                            >
                              ✅ 차단 즉시 해제
                            </button>
                          )}
                          <button
                            type="button"
                            onClick={(e) => {
                              setEditingAdminUserId(null);
                              setPopupOrigin(captureTriggerOrigin(e));
                              setUserToDelete(targetU);
                            }}
                            className="flex-1 py-1.5 bg-rose-600 text-white font-extrabold rounded-lg text-[10px]"
                          >
                            🗑️ 계정 영구 삭제
                          </button>
                        </div>
                      </div>

                      <button type="submit" className="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white font-extrabold rounded-2xl text-xs shadow">
                        변경사항 저장하기
                      </button>
                    </form>
                  </div>
                );
              })()}
            </OriginPopup>

          </div>

          {/* BOTTOM NAVIGATION BAR */}
          {!activeRoomId && (
            <nav
              style={{ paddingBottom: 'max(0.65rem, env(safe-area-inset-bottom))' }}
              className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-200 px-1 pt-2 flex items-center justify-around z-40 shadow-[0_-4px_20px_rgba(15,23,42,0.06)]"
            >
              <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-0.5 py-1 flex-1 transition ${activeTab === 'home' ? 'text-teal-600 font-extrabold' : 'text-slate-400'}`}>
                <Home className="w-5 h-5" />
                <span className="text-[10px]">홈</span>
              </button>

              <button onClick={() => setActiveTab('chats')} className={`flex flex-col items-center gap-0.5 py-1 flex-1 transition ${activeTab === 'chats' ? 'text-teal-600 font-extrabold' : 'text-slate-400'}`}>
                <MessageSquare className="w-5 h-5" />
                <span className="text-[10px]">대화방</span>
              </button>

              <button onClick={() => setActiveTab('lost')} className={`flex flex-col items-center gap-0.5 py-1 flex-1 transition ${activeTab === 'lost' ? 'text-teal-600 font-extrabold' : 'text-slate-400'}`}>
                <SearchCode className="w-5 h-5" />
                <span className="text-[10px]">분실물</span>
              </button>

              <button onClick={() => setActiveTab('wee')} className={`flex flex-col items-center gap-0.5 py-1 flex-1 transition ${activeTab === 'wee' ? 'text-rose-600 font-extrabold' : 'text-slate-400'}`}>
                <HeartHandshake className="w-5 h-5" />
                <span className="text-[10px]">Wee클래스</span>
              </button>

              <button onClick={() => setActiveTab('mypage')} className={`flex flex-col items-center gap-0.5 py-1 flex-1 transition ${activeTab === 'mypage' ? 'text-teal-600 font-extrabold' : 'text-slate-400'}`}>
                <User className="w-5 h-5" />
                <span className="text-[10px]">마이페이지</span>
              </button>

              {currentUser.isAdmin && (
                <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center gap-0.5 py-1 flex-1 transition relative ${activeTab === 'admin' ? 'text-amber-500 font-extrabold' : 'text-slate-400'}`}>
                  <ShieldCheck className="w-5 h-5" />
                  {(reports.length + aiLogs.length + pendingAppealsCount) > 0 && (
                    <span className="absolute top-0 right-1.5 min-w-[14px] h-3.5 px-1 bg-rose-600 text-white text-[8px] font-black rounded-full flex items-center justify-center">
                      {reports.length + aiLogs.length + pendingAppealsCount}
                    </span>
                  )}
                  <span className="text-[10px]">관리자</span>
                </button>
              )}
            </nav>
          )}
        </div>
      );
    }

    class AppErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMsg: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMsg: error?.message || '알 수 없는 렌더링 오류' };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
              <div className="max-w-sm w-full bg-white rounded-3xl p-6 shadow-xl border border-slate-200 text-center space-y-3">
                <p className="text-2xl">🛡️</p>
                <h2 className="font-black text-base text-slate-900">일시적인 화면 오류가 감지되었습니다</h2>
                <p className="text-xs text-slate-500 break-words">{this.state.errorMsg}</p>
                <button
                  type="button"
                  onClick={() => this.setState({ hasError: false, errorMsg: '' })}
                  className="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white font-extrabold rounded-2xl text-xs shadow"
                >
                  화면 즉시 복구하기
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AppErrorBoundary>
        <App />
      </AppErrorBoundary>
    );
  </script>
</body>
</html>
