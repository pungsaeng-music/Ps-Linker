  <!-- 다크 모드 & 리퀴드 글래스·틴트 초기 깜빡임(FOUC) 방지 -->
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var saved = localStorage.getItem('ps_linker_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          root.classList.add('dark');
        }

        var TINT_MAP = {
          none: [255, 255, 255],
          teal: [20, 184, 166],
          ocean: [59, 130, 246],
          lavender: [168, 85, 247],
          rose: [244, 63, 94],
          amber: [245, 158, 11],
          emerald: [16, 185, 129]
        };

        var densityRaw = localStorage.getItem('ps_linker_glass_density');
        var density = densityRaw !== null ? Math.max(0, Math.min(100, Number(densityRaw))) : 65;
        var tintPreset = localStorage.getItem('ps_linker_tint_preset') || 'teal';
        var tintCustom = localStorage.getItem('ps_linker_tint_custom') || '#14b8a6';
        var tintStrengthRaw = localStorage.getItem('ps_linker_tint_strength');
        var tintStrength = tintStrengthRaw !== null ? Math.max(0, Math.min(100, Number(tintStrengthRaw))) : 22;

        var rgb = [20, 184, 166];
        if (tintPreset === 'custom' && /^#[0-9a-fA-F]{6}$/.test(tintCustom)) {
          rgb = [
            parseInt(tintCustom.slice(1, 3), 16),
            parseInt(tintCustom.slice(3, 5), 16),
            parseInt(tintCustom.slice(5, 7), 16)
          ];
        } else if (TINT_MAP[tintPreset]) {
          rgb = TINT_MAP[tintPreset];
        }

        var d = density / 100;
        var effectiveTintAlpha = tintPreset === 'none' ? 0 : (tintStrength / 100) * 0.34;
        if (d > 0) root.classList.add('liquid-glass');

        root.style.setProperty('--lg-density', d.toFixed(2));
        root.style.setProperty('--lg-blur', Math.round(d * 28) + 'px');
        root.style.setProperty('--lg-saturate', Math.round(100 + d * 95) + '%');
        root.style.setProperty('--lg-surface-alpha', (0.98 - d * 0.32).toFixed(3));
        root.style.setProperty('--lg-card-alpha', (0.99 - d * 0.29).toFixed(3));
        root.style.setProperty('--lg-modal-alpha', (0.99 - d * 0.18).toFixed(3));
        root.style.setProperty('--lg-sheen-alpha', (d * 0.45).toFixed(3));
        root.style.setProperty('--lg-tint-r', String(rgb[0]));
        root.style.setProperty('--lg-tint-g', String(rgb[1]));
        root.style.setProperty('--lg-tint-b', String(rgb[2]));
        root.style.setProperty('--lg-tint-alpha', effectiveTintAlpha.toFixed(3));
      } catch (e) {}
    })();
  </script>

    function calculateDDayLabel(targetDateStr) {
      if (!targetDateStr) return 'D-?';
      const now = new Date();
      const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const parts = targetDateStr.split('-').map(Number);
      if (parts.length !== 3) return 'D-?';
      const targetMidnight = new Date(parts[0], parts[1] - 1, parts[2]);
      const diffDays = Math.round((targetMidnight - todayMidnight) / (1000 * 60 * 60 * 24));
      if (diffDays === 0) return 'D-DAY';
      if (diffDays > 0) return `D-${diffDays}`;
      return `D+${Math.abs(diffDays)}`;
    }

      for (const bPat of BULLYING_CONTEXT_PATTERNS) {
        const bMatch = safeCheckText.match(bPat);
        if (bMatch) {
          isFiltered = true;
          const detail = `인신공격/괴롭힘 문맥('${bMatch[0]}')`;
          if (!reasons.includes(detail)) reasons.push(detail);
          cleanText = cleanText.replace(bPat, (m) => '*'.repeat(m.length));
        }
      }

      if (isFiltered && cleanText === text) {
        cleanText = '*'.repeat(Math.max(4, text.length));
      }

      return {
        cleanText,
        isFiltered,
        foundWords,
        aiReason: reasons.join(', ') || 'AI 유해 표현 감지'
      };
    }

      if (!nick) return '익명';

      if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return [20, 184, 166];
      return [

        parseInt(hex.slice(3, 5), 16),
        parseInt(hex.slice(5, 7), 16)
      ];
    }

      useEffect(() => {
        if (!viewingOnceMsg) return;

        const DURATION_MS = 5000;
        const deadline = Date.now() + DURATION_MS;
        let closed = false;

        const timerId = setInterval(() => {
          const rem = Math.max(0, deadline - Date.now());
          setOnceTimeLeftMs(rem);
          if (rem <= 0 && !closed) {
            closed = true;
            clearInterval(timerId);
            setViewingOnceMsg(null);
            setOnceCaptureBlocked(false);
            triggerToast('⏱️ 5초 열람 시간이 만료되어 사진이 영구 잠금되었습니다.', 'warning');
          }
        }, 50);

        const triggerCaptureBlock = () => {
          if (closed) return;
          closed = true;
          clearInterval(timerId);
          setOnceCaptureBlocked(true);
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText('보안 정책에 의해 캡쳐가 차단되었습니다.').catch(() => {});
            }
          } catch {}
          setTimeout(() => {
            setViewingOnceMsg(null);
            setOnceCaptureBlocked(false);
            triggerToast('🚨 캡쳐 또는 화면 이탈 시도가 감지되어 1회용 사진이 즉시 파기되었습니다.', 'danger');
          }, 900);
        };

        const handleBlur = () => triggerCaptureBlock();
        const handleVisibilityChange = () => {
          if (document.hidden) triggerCaptureBlock();
        };
        const handlePageHide = () => triggerCaptureBlock();
        const handleKeyEvent = (e) => {
          const key = (e.key || '').toLowerCase();
          const isScreenshotKey =
            e.key === 'PrintScreen' ||
            e.keyCode === 44 ||
            ((e.metaKey || e.ctrlKey) && e.shiftKey && ['3', '4', '5', 's', 'i'].includes(key)) ||
            ((e.metaKey || e.ctrlKey) && ['p', 's', 'u'].includes(key)) ||
            e.key === 'F12';

          if (isScreenshotKey) {
            e.preventDefault();
            e.stopPropagation();
            triggerCaptureBlock();
          }
        };

        window.addEventListener('blur', handleBlur);
        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('pagehide', handlePageHide);
        window.addEventListener('keydown', handleKeyEvent, true);
        window.addEventListener('keyup', handleKeyEvent, true);

        return () => {
          closed = true;
          clearInterval(timerId);
          window.removeEventListener('blur', handleBlur);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          window.removeEventListener('pagehide', handlePageHide);
          window.removeEventListener('keydown', handleKeyEvent, true);
          window.removeEventListener('keyup', handleKeyEvent, true);
        };
      }, [viewingOnceMsg]);

      useEffect(() => {
        if (!viewingOnceMsg || onceCaptureBlocked || !onceCanvasRef.current) return;
        const canvas = onceCanvasRef.current;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const img = new Image();
        img.onload = () => {
          const maxW = 720;
          const maxH = 720;
          let w = img.width || 480;
          let h = img.height || 480;
          const scale = Math.min(1, maxW / w, maxH / h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);

          canvas.width = w;
          canvas.height = h;
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);

          // 열람자 식별 보안 워터마크 (외부 카메라 촬영 추적 방지)
          ctx.save();
          ctx.translate(w / 2, h / 2);
          ctx.rotate(-Math.PI / 6);
          ctx.font = 'bold 14px Pretendard, sans-serif';
          ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.28)';
          ctx.lineWidth = 2;
          ctx.textAlign = 'center';
          const wmText = `풍생링커 보안열람 • ${currentUser?.nickname || '학생'} (${currentUser?.email || ''})`;

            ctx.strokeText(wmText, 0, y);

          }
          ctx.restore();
        };
        img.src = viewingOnceMsg.image;

        const msgAgeMs = Date.now() - selectedMsgForAction.timestamp;
        const TIME_LIMIT_MS = 80 * 1000;

        if (msgAgeMs > TIME_LIMIT_MS) {
          triggerToast('⏱️ 메시지 전송 후 1분 20초가 지나 삭제할 수 없습니다.', 'warning');
          setShowMsgActionModal(false);
          return;
        }

        if (firebaseDb) {
          firebaseDb.ref(`messages/${selectedMsgForAction.id}`).remove();
        }
        setAllMessages(prev => prev.filter(m => m.id !== selectedMsgForAction.id));
        triggerToast('🗑️ 메시지가 삭제되었습니다.', 'info');
        setShowMsgActionModal(false);
      };

      const handleReportMessageSubmit = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (isSubmittingReport) return;
        if (!selectedMsgForAction) {
          triggerToast('🚨 신고 대상 메시지를 찾을 수 없습니다. 다시 선택해 주세요.', 'warning');
          setShowReportMsgModal(false);
          return;
        }

        const targetRoomId = String(selectedMsgForAction.roomId || activeRoomId || '');
        const roomObj = rooms.find(r => r.id === targetRoomId);
        const categoryName = CATEGORIES[roomObj?.category || 'STUDY']?.name || '대화방';
        const roomTitleStr = String(roomObj?.title || '대화방');
        const reportedUser = adminUserList.find(u => u.nickname === selectedMsgForAction.sender || u.email === selectedMsgForAction.senderEmail);

        const roomMsgsSorted = allMessages
          .filter(m => m.roomId === targetRoomId && !m.isSystem)
          .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
        const targetIdx = roomMsgsSorted.findIndex(m => m.id === selectedMsgForAction.id);
        let contextSlice = [];
        if (targetIdx !== -1) {
          const startIdx = Math.max(0, targetIdx - 1);
          const endIdx = Math.min(roomMsgsSorted.length, targetIdx + 2);
          contextSlice = roomMsgsSorted.slice(startIdx, endIdx).map(m => ({
            sender: m.sender || '익명',
            text: m.text || (m.image ? (m.imageViewMode === 'once' ? '[1회 열람 사진]' : '[첨부 사진]') : '(내용 없음)'),
            timeStr: new Date(m.timestamp || Date.now()).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
            isTarget: m.id === selectedMsgForAction.id
          }));
        }

        const msgTimeStr = selectedMsgForAction.timestamp
          ? new Date(selectedMsgForAction.timestamp).toLocaleString('ko-KR')
          : '방 제목/헤더 영역';
        const contentTypeLabel = selectedMsgForAction.isRoomHeaderReport
          ? '대화방 제목/개설 영역'
          : selectedMsgForAction.image && selectedMsgForAction.text
          ? `텍스트 + ${selectedMsgForAction.imageViewMode === 'once' ? '1회용 사진' : '일반 사진'} 메시지`
          : selectedMsgForAction.image
          ? `${selectedMsgForAction.imageViewMode === 'once' ? '1회용 사진' : '일반 사진'} 메시지`
          : '텍스트 채팅 메시지';

        const locationPath = `[${categoryName}] "${roomTitleStr}" > ${reportSourceContext} (${contentTypeLabel} / 작성시각: ${msgTimeStr})`;

        const newReport = {
          id: `rep-${Date.now()}-${Math.random().toString(36).substring(2, 6)}`,
          messageId: String(selectedMsgForAction.id || ''),
          roomId: targetRoomId,
          roomCategory: categoryName,
          roomTitle: roomTitleStr,
          reportSource: reportSourceContext,
          contentType: contentTypeLabel,
          messageTimestamp: selectedMsgForAction.timestamp || Date.now(),
          reportLocationPath: locationPath,
          reportDetailNote: reportDetailNote.trim(),
          contextMessages: contextSlice,
          reporterNick: String(currentUser?.nickname || '익명'),
          reporterRealName: String(currentUser?.realName || '미입력'),
          reporterEmail: String(currentUser?.email || '정보 없음'),
          reportedUserNick: String(selectedMsgForAction.sender || '알 수 없음'),
          reportedUserRealName: String(reportedUser?.realName || '미입력'),
          reportedUserEmail: String(selectedMsgForAction.senderEmail || '정보 없음'),
          messageText: String(selectedMsgForAction.text || (selectedMsgForAction.image ? '[사진 메시지]' : '(내용 없음)')),
          messageImage: selectedMsgForAction.image || null,
          isOnceImage: selectedMsgForAction.imageViewMode === 'once',
          reason: String(reportReason || '기타 부적절한 행위'),
          timestamp: Date.now(),
          status: 'PENDING'
        };

        if (firebaseDb) {
          setIsSubmittingReport(true);
          try {
            firebaseDb.ref(`reports/${newReport.id}`).set(newReport)
              .then(() => {
                setIsSubmittingReport(false);
                setShowReportMsgModal(false);
                setShowMsgActionModal(false);
                setSelectedMsgForAction(null);
                setReportDetailNote('');
                triggerToast('🚨 신고 위치·경로와 함께 총괄 관리자 대시보드로 접수되었습니다.', 'success');
              })
              .catch((err) => {
                setIsSubmittingReport(false);
                console.error('신고 DB 저장 오류:', err);
                triggerToast(`🚨 신고 저장 실패 (${err?.code || '권한 오류'}): Firebase DB 규칙을 확인해 주세요.`, 'danger');
              });
          } catch (err) {
            setIsSubmittingReport(false);
            console.error('신고 요청 오류:', err);
            triggerToast('🚨 신고 전송 중 오류가 발생했습니다.', 'danger');
          }
        } else {
          setReports(prev => [newReport, ...prev]);
          setShowReportMsgModal(false);
          setShowMsgActionModal(false);
          setSelectedMsgForAction(null);
          setReportDetailNote('');
          triggerToast('🚨 신고 위치·경로와 함께 총괄 관리자 대시보드로 접수되었습니다.', 'success');
        }
      };

      const resolveReport = (reportId, actionMessage = '✅ 신고가 처리 완결되었습니다.') => {
        if (firebaseDb) {
          firebaseDb.ref(`reports/${reportId}`).remove();
        }
        setReports(prev => prev.filter(r => r.id !== reportId));
        if (actionMessage) {
          triggerToast(actionMessage, 'success');
        }
      };

      const handleCreateRoom = (e) => {
        if (e) e.preventDefault();
        const titleTrimmed = newRoomTitle.trim();
        if (!titleTrimmed) return;

        const { isBanned, timeText } = checkUserBanned();
        if (isBanned) {
          triggerToast(`⛔ 채팅이 차단된 계정입니다. (남은 차단 시간: ${timeText})`, 'danger');
          return;
        }

        const { cleanText, isFiltered, aiReason } = filterText(titleTrimmed);
        if (isFiltered) {
          recordAiSecurityLog('TEXT_EVASION', `방 제목 개설 차단 - ${aiReason}`, titleTrimmed, '새 대화방 개설');
          triggerToast(`🤖 AI 보안관 차단: ${aiReason} 포함으로 방 개설이 차단되었습니다.`, 'danger');
          return;
        }

        const roomId = `room-${Date.now()}`;
        const now = Date.now();

        const newRoom = {
          id: roomId,
          title: cleanText,
          category: newRoomCategory,
          creator: currentUser.nickname,
          creatorEmail: currentUser.email,
          membersCount: 1,
          lastMessageAt: now,
          createdAt: now,
          image: newRoomImage || null
        };

        const sysMsg = {
          id: `m-${now}`,
          roomId: roomId,
          sender: '시스템',
          text: `🎉 '${cleanText}' 대화방이 개설되었습니다.`,
          timestamp: now,
          isSystem: true
        };

        if (firebaseDb) {
          firebaseDb.ref(`rooms/${newRoom.id}`).set(newRoom);
          firebaseDb.ref(`messages/${sysMsg.id}`).set(sysMsg);
        } else {
          setRooms(prev => [newRoom, ...prev]);
          setAllMessages(prev => [...prev, sysMsg]);
        }
        setNewRoomTitle('');
        setNewRoomImage(null);
        setShowCreateModal(false);
        setActiveRoomId(roomId);
        triggerToast(`💬 '${cleanText}' 대화방이 개설되었습니다!`, 'success');
      };

      const handleCreateLostItem = (e) => {
        if (e) e.preventDefault();
        if (!lostForm.title.trim()) return;

        const newItem = {
          id: `l-${Date.now()}`,
          title: lostForm.title.trim(),
          location: lostForm.location.trim() || '교내 지정장소',
          date: '방금 전',
          status: '보관중',
          timestamp: Date.now(),
          image: lostForm.image || null
        };

        if (firebaseDb) {
          firebaseDb.ref(`lostItems/${newItem.id}`).set(newItem);
        } else {
          setLostItems(prev => [newItem, ...prev]);
        }
        setShowLostPostModal(false);
        setLostForm({ title: '', location: '', date: '', image: null });
        triggerToast('🎁 분실물이 실시간으로 등록되었습니다.', 'success');
      };

      const handleAdminBanUser = (userId, hours) => {
        const banUntilTimestamp = hours > 0 ? Date.now() + hours * 3600 * 1000 : null;
        if (firebaseDb) {
          firebaseDb.ref(`users/${userId}/bannedUntil`).set(banUntilTimestamp);
        }
        setAdminUserList(prev => prev.map(u => u.id === userId ? { ...u, bannedUntil: banUntilTimestamp } : u));
        if (currentUser.id === userId) {
          setCurrentUser(prev => ({ ...prev, bannedUntil: banUntilTimestamp }));
        }

        if (hours > 0) {
          const timeLabel = hours >= 24 ? `${Math.round(hours / 24)}일` : `${hours}시간`;
          triggerToast(`⛔ 채팅 ${timeLabel} 차단이 설정되었습니다.`, 'warning');
        } else {
          triggerToast(`✅ 채팅 차단이 해제되었습니다.`, 'success');
        }
      };

      const confirmForceDeleteUser = () => {
        if (!userToDelete) return;
        const targetId = userToDelete.id;
        const targetNick = userToDelete.nickname;
        const targetEmail = userToDelete.email;

        if (firebaseDb) {
          firebaseDb.ref(`users/${targetId}`).remove();
          reports.forEach(r => {
            if (r.reportedUserEmail === targetEmail || r.reportedUserNick === targetNick) {
              firebaseDb.ref(`reports/${r.id}`).remove();
            }
          });
        }
        setAdminUserList(prev => prev.filter(u => u.id !== targetId));
        setReports(prev => prev.filter(r => r.reportedUserEmail !== targetEmail && r.reportedUserNick !== targetNick));

        if (currentUser.id === targetId) {
          setIsLoggedIn(false);
          setAuthStep(1);
          triggerToast(`🚨 현재 접속중인 계정이 강제 삭제되어 로그아웃되었습니다.`, 'danger');
        } else {
          triggerToast(`🗑️ '${targetNick}' 계정이 영구 삭제되고 관련 신고도 처리 완료되었습니다.`, 'danger');
        }
        setUserToDelete(null);
      };

      const confirmForceCloseRoom = () => {
        if (!roomToDelete) return;
        const roomId = roomToDelete.id;
        const roomTitle = roomToDelete.title;

        if (firebaseDb) {
          firebaseDb.ref(`rooms/${roomId}`).remove();
          allMessages.forEach(m => {
            if (m.roomId === roomId) firebaseDb.ref(`messages/${m.id}`).remove();
          });
          reports.forEach(r => {
            if (r.roomId === roomId) firebaseDb.ref(`reports/${r.id}`).remove();
          });
        }
        setRooms(prev => prev.filter(r => r.id !== roomId));
        setAllMessages(prev => prev.filter(m => m.roomId !== roomId));
        setReports(prev => prev.filter(r => r.roomId !== roomId));

        if (activeRoomId === roomId) setActiveRoomId(null);
        if (adminInspectedRoomId === roomId) setAdminInspectedRoomId(null);

        triggerToast(`🗑️ '${roomTitle}' 대화방이 즉시 강제 폐쇄되었습니다.`, 'danger');
        setRoomToDelete(null);
      };

      const handleAdminDeleteMessage = (msgId) => {
        if (firebaseDb) {
          firebaseDb.ref(`messages/${msgId}`).remove();
        }
        setAllMessages(prev => prev.filter(m => m.id !== msgId));
        triggerToast(`🗑️ 해당 메시지가 삭제되었습니다.`, 'info');
      };

      const currentRoomMessages = useMemo(() => {
        if (!activeRoomId) return [];
        return allMessages.filter(m => m.roomId === activeRoomId).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
      }, [allMessages, activeRoomId]);

      const filteredRooms = useMemo(() => {
        return rooms.filter(room => {
          if (selectedCategory !== 'ALL' && room.category !== selectedCategory) return false;
          if (searchQuery.trim() && !room.title.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          const { isExpired } = calculateRemainingTime(room.lastMessageAt, room.category);
          return !isExpired;
        });
      }, [rooms, selectedCategory, searchQuery]);

      const classRankings = useMemo(() => {
        const classMap = {};
        adminUserList.forEach(u => {
          const cls = u.gradeClass || '1학년 1반';
          if (cls === '교직원') return;
          if (!classMap[cls]) classMap[cls] = { name: cls, totalTemp: 0, count: 0 };
          classMap[cls].totalTemp += u.temperature;
          classMap[cls].count += 1;
        });

        return Object.values(classMap)
          .map(c => ({ name: c.name, avgTemp: Math.round((c.totalTemp / c.count) * 10) / 10, count: c.count }))
          .sort((a, b) => b.avgTemp - a.avgTemp);
      }, [adminUserList]);

      const activeRoom = rooms.find(r => r.id === activeRoomId);
      const pendingAppealsCount = useMemo(() => mannerLogs.filter(m => m.appealStatus === 'pending').length, [mannerLogs]);

      const renderFormattedText = (text) => {
        if (!text) return null;
        if (text.includes('```')) {
          const parts = text.split('```');
          return (
            <div className="space-y-1">
              {parts.map((part, i) => {
                if (i % 2 === 1) {
                  return (
                    <pre key={i} className="bg-slate-900 text-emerald-400 p-2.5 rounded-lg text-[11px] font-mono overflow-x-auto border border-slate-700">
                      <code>{part.trim()}</code>
                    </pre>
                  );
                }
                return part ? <p key={i}>{part}</p> : null;
              })}
            </div>
          );
        }
        if (text.includes('$')) {
          const parts = text.split('$');
          return (
            <span>
              {parts.map((part, i) => {
                if (i % 2 === 1) {
                  return (
                    <span key={i} className="inline-block px-2 py-0.5 bg-amber-100 text-amber-900 rounded font-mono font-bold text-[11px] border border-amber-300 mx-0.5 shadow-sm">
                      {part}
                    </span>
                  );
                }
                return part;
              })}
            </span>
          );
        }
        return text;
      };

      // LOGIN SCREEN
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen lg-ambient-wrapper text-slate-800 flex justify-center items-center font-sans antialiased p-4 ios-scroll">
            <div className="w-full max-w-md bg-white lg-shell rounded-3xl p-6 shadow-2xl space-y-6 relative overflow-hidden border border-slate-200">
              <div className="flex items-center justify-between gap-2">
                <button
                  type="button"
                  onClick={handleOpenChangelog}
                  className="relative px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 rounded-full text-[11px] font-extrabold transition inline-flex items-center gap-1"
                >
                  <Bell className="w-3.5 h-3.5 text-teal-600" />
                  <span>업데이트 {APP_VERSION}</span>
                  {hasUnreadUpdate && (
                    <span className="w-2 h-2 rounded-full bg-rose-500 animate-ping" />
                  )}
                </button>

                <button
                  type="button"
                  onClick={() => setShowAppearanceModal(true)}
                  className="px-3 py-1.5 bg-teal-50 hover:bg-teal-100 text-teal-800 border border-teal-200 rounded-full text-[11px] font-extrabold transition inline-flex items-center gap-1.5 shadow-sm"
                >
                  {isDarkMode ? <Moon className="w-3.5 h-3.5 text-indigo-400" /> : <Sun className="w-3.5 h-3.5 text-amber-500" />}
                  <span>✨ 글래스·다크 설정</span>
                </button>
              </div>
              
              <div className="text-center space-y-2">
                <div className="w-16 h-16 bg-teal-600 text-white rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-teal-200">
                  <HeartHandshake className="w-9 h-9" />
                </div>
                <h1 className="text-2xl font-black text-slate-900 tracking-tight">풍생 링커 로그인</h1>
                <p className="text-xs text-teal-700 font-bold">Poongsaeng High School Linker</p>
                <p className="text-[11px] text-slate-500">교내 전용 이메일(<span className="font-mono text-teal-600 font-bold">@ps.hs.kr</span>)로 안전하게 인증하세요.</p>
              </div>

              {authError && (
                <div className="p-3 bg-rose-50 text-rose-700 text-xs font-bold rounded-2xl border border-rose-200 flex items-center gap-2">
                  <Shield className="w-4 h-4 text-rose-500 shrink-0" />
                  <span>{authError}</span>
                </div>
              )}

              {authStep === 1 && (
                <form onSubmit={handleRequestAuthCode} className="space-y-4">
                  <div className="space-y-1">
                    <label className="block text-xs font-extrabold text-slate-700">교내 이메일 주소</label>
                    <div className="relative">
                      <Mail className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                      <input 
                        type="email" 
                        value={loginEmail} 
                        onChange={(e) => setLoginEmail(e.target.value)}
                        placeholder="예: student1@ps.hs.kr" 
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-9 pr-3 py-3 text-xs text-slate-900 font-medium focus:outline-none focus:border-teal-600"
                        required
                      />
                    </div>
                  </div>

                  <button type="submit" className="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-extrabold rounded-2xl text-xs shadow-lg transition flex items-center justify-center gap-2">
                    <span>인증코드 발송</span>
                    <ArrowRight className="w-4 h-4" />
                  </button>
                </form>
              )}

              {authStep === 2 && (
                <form onSubmit={handleVerifyAuthCode} className="space-y-4">
                  <div className="p-3 bg-teal-50 rounded-2xl border border-teal-200 text-xs text-teal-900 space-y-1">
                    <p className="font-extrabold">📬 수신 이메일: {loginEmail}</p>
                    <p className="text-[11px] text-teal-700">아래 웹메일 수신함 버튼을 눌러 발송된 6자리 코드를 확인해 주세요.</p>
                  </div>

                  <div className="space-y-1">
                    <label className="block text-xs font-extrabold text-slate-700">6자리 인증번호</label>
                    <div className="relative">
                      <KeyRound className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                      <input 
                        type="text" 
                        value={verificationCode} 
                        onChange={(e) => setVerificationCode(e.target.value)}
                        placeholder="인증번호 6자리 입력" 
                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-9 pr-3 py-3 text-xs text-slate-900 font-mono font-bold tracking-widest focus:outline-none focus:border-teal-600"
                        maxLength="6"
                        required
                      />
                    </div>
                  </div>

                  <div className="flex gap-2">
                    <button type="button" onClick={() => setShowWebmailModal(true)} className="flex-1 py-3 bg-amber-100 hover:bg-amber-200 text-amber-900 font-extrabold rounded-2xl text-xs transition border border-amber-200">
                      📬 웹메일 수신함 열기
                    </button>
                    <button type="submit" className="flex-1 py-3 bg-teal-600 hover:bg-teal-700 text-white font-extrabold rounded-2xl text-xs shadow transition">
                      인증 확인
                    </button>
                  </div>
                </form>
              )}

              {authStep === 3 && (
                <form onSubmit={handleCompleteRegistration} className="space-y-4">
                  <div className="p-3 bg-emerald-50 text-emerald-900 text-xs font-extrabold rounded-2xl border border-emerald-200">
                    ✅ 이메일 인증 완료! 사용할 닉네임과 본명을 정해 주세요.
                  </div>

                  <div className="space-y-1">
                    <label className="block text-xs font-extrabold text-slate-700">사용할 익명 닉네임</label>
                    <input 
                      type="text" 
                      value={authNickname} 
                      onChange={(e) => setAuthNickname(e.target.value)}
                      placeholder="예: 푸른풍생인" 
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-3 text-xs text-slate-900 font-bold focus:outline-none focus:border-teal-600"
                      required
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="block text-xs font-extrabold text-slate-700 flex items-center justify-between">
                      <span>실명 / 본명</span>
                      <span className="text-[10px] text-rose-500 font-bold">🔒 관리자에게만 비공개 제공</span>
                    </label>
                    <input 
                      type="text" 
                      value={authRealName} 
                      onChange={(e) => setAuthRealName(e.target.value)}
                      placeholder="예: 홍길동 (학생증/본인 확인용)" 
                      className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-3 text-xs text-slate-900 font-bold focus:outline-none focus:border-teal-600"
                      required
                    />
                  </div>

                  <button type="submit" className="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-extrabold rounded-2xl text-xs shadow-lg transition">
                    풍생 링커 시작하기 🌱
                  </button>
                </form>
              )}

              <div className="pt-4 border-t border-slate-100 text-center">
                <button 
                  type="button"
                  onClick={() => setShowLoginBetaModal(true)}
                  className="px-3.5 py-1.5 bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 rounded-full text-[11px] font-extrabold transition shadow-sm inline-flex items-center gap-1.5"
                >
                  <span>🧪 베타 계정 선택</span>

                    </button>
                  </div>

                  {/* 5초 카운트다운 진행 바 */}
                  <div className="w-full h-1.5 bg-white/15 rounded-full overflow-hidden">
                    <div
                      className={`h-full transition-all duration-75 ${onceTimeLeftMs <= 2000 ? 'bg-rose-500' : 'bg-amber-400'}`}
                      style={{ width: `${Math.max(0, Math.min(100, (onceTimeLeftMs / 5000) * 100))}%` }}
                    />
                  </div>
                </div>

                {/* 중앙 보안 캔버스 영역 (캡쳐/화면이탈 시 즉시 암전 파기) */}
                <div className="flex-1 flex items-center justify-center overflow-hidden my-3 relative">
                  {onceCaptureBlocked ? (
                    <div className="p-6 rounded-3xl bg-rose-950/90 border-2 border-rose-500 text-center space-y-2 max-w-xs">
                      <Shield className="w-10 h-10 text-rose-400 mx-auto" />
                      <p className="text-sm font-black text-white">🚨 화면 캡쳐 / 이탈 감지됨</p>
                      <p className="text-[11px] text-rose-200 leading-relaxed">
                        보안 정책에 따라 사진이 즉시 암전 파기되었습니다.
                      </p>
                    </div>
                  ) : (
                    <div className="relative flex items-center justify-center max-w-full max-h-full">
                      <canvas
                        ref={onceCanvasRef}
                        className="max-h-[72vh] max-w-full rounded-2xl object-contain shadow-2xl border border-white/15 pointer-events-none select-none"
                      />
                      {/* 우클릭·길게누르기·드래그 방지 투명 방패 오버레이 */}
                      <div
                        onContextMenu={(e) => e.preventDefault()}
                        onDragStart={(e) => e.preventDefault()}
                        onTouchStart={(e) => {
                          if (e.touches && e.touches.length > 1) {
                            setOnceCaptureBlocked(true);
                          }
                        }}
                        className="absolute inset-0 z-10 bg-transparent"
                      />
                    </div>
                  )}
                </div>

                <div className="text-center space-y-1">
                  <p className="text-[11px] text-amber-300 font-extrabold">
                    🔒 캡쳐 · 화면 녹화 · 앱 전환 · 저장 원천 차단 작동 중
                  </p>
                  <p className="text-[10px] text-slate-400">
                    5초 경과 또는 창을 닫으면 영구 잠금되어 다시 볼 수 없습니다.
                  </p>
                </div>
              </div>
            )}

            {/* ALWAYS-VIEW PHOTO LIGHTBOX MODAL */}
            {enlargedPhotoUrl && (
              <div
                onClick={() => setEnlargedPhotoUrl(null)}
                className="fixed inset-0 z-[80] bg-black/90 backdrop-blur-sm flex flex-col justify-between p-4"
              >
                <div className="flex items-center justify-between text-white">
                  <span className="px-2.5 py-1 bg-teal-600 text-white text-[10px] font-black rounded-full">
                    🖼️ 계속 보기 사진
                  </span>
                  <button
                    type="button"
                    onClick={() => setEnlargedPhotoUrl(null)}
                    className="p-2 bg-white/15 hover:bg-white/25 text-white rounded-full transition"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="flex-1 flex items-center justify-center overflow-hidden my-3">
                  <img
                    src={enlargedPhotoUrl}
                    alt="확대 사진"
                    onClick={(e) => e.stopPropagation()}
                    className="max-h-[78vh] max-w-full rounded-2xl object-contain shadow-2xl"
                  />
                </div>

                <p className="text-center text-[11px] text-slate-300 font-bold">
                  바탕을 터치하면 닫힙니다. 대화방에서 언제든 다시 열람할 수 있습니다.
                </p>
              </div>
            )}

            {renderAppearanceModal()}
            {renderChangelogModal()}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
