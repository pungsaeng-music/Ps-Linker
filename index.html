  <!-- Firebase v11.6.1 Modular SDK Bridge -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'wee-class-counseling-app';
    let db = null;
    let auth = null;
    let currentAuthUser = null;
    let isReady = false;
    const readyCallbacks = [];

    const notifyReady = () => {
      isReady = true;
      readyCallbacks.forEach((cb) => {
        try { cb({ db, auth, user: currentAuthUser, appId }); } catch (e) { console.error(e); }
      });
    };

    (async function initFirebase() {
      try {
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          const firebaseConfig = typeof __firebase_config === 'string'
            ? JSON.parse(__firebase_config)
            : __firebase_config;

          const app = initializeApp(firebaseConfig);
          auth = getAuth(app);
          db = getFirestore(app);

          // RULE 3: Authenticate FIRST before any Firestore operations
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }

          onAuthStateChanged(auth, (user) => {
            currentAuthUser = user;
            if (user && !isReady) {
              notifyReady();
            }
          });
        } else {
          // Fallback when opened standalone outside sandbox
          notifyReady();
        }
      } catch (err) {
        console.error("Firebase 초기화 중 오류:", err);
        notifyReady();
      }
    })();

    window.__WEE_CLOUD__ = {
      onReady(cb) {
        if (isReady) {
          cb({ db, auth, user: currentAuthUser, appId });
        } else {
          readyCallbacks.push(cb);
        }
      },
      // RULE 1 & RULE 2: Strict /artifacts/{appId}/public/data/{collectionName} & simple collection() query
      subscribeRequests(onData, onErr) {
        if (!db || !currentAuthUser) return () => {};
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'wee_requests');
        return onSnapshot(
          colRef,
          (snapshot) => {
            const list = [];
            snapshot.forEach((docSnap) => {
              list.push({ id: docSnap.id, ...docSnap.data() });
            });
            onData(list);
          },
          (error) => {
            console.error("wee_requests 구독 오류:", error);
            if (onErr) onErr(error);
          }
        );
      },
      subscribeMessages(onData, onErr) {
        if (!db || !currentAuthUser) return () => {};
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'wee_messages');
        return onSnapshot(
          colRef,
          (snapshot) => {
            const list = [];
            snapshot.forEach((docSnap) => {
              list.push({ id: docSnap.id, ...docSnap.data() });
            });
            onData(list);
          },
          (error) => {
            console.error("wee_messages 구독 오류:", error);
            if (onErr) onErr(error);
          }
        );
      },
      async saveRequest(requestObj) {
        if (!db || !currentAuthUser) return false;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'wee_requests', requestObj.id);
        await setDoc(docRef, requestObj);
        return true;
      },
      async updateRequest(requestId, updates) {
        if (!db || !currentAuthUser) return false;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'wee_requests', requestId);
        await updateDoc(docRef, updates);
        return true;
      },
      async saveMessage(messageObj) {
        if (!db || !currentAuthUser) return false;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'wee_messages', messageObj.id);
        await setDoc(docRef, messageObj);
        return true;
      },
      async deleteRequest(requestId) {
        if (!db || !currentAuthUser) return false;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'wee_requests', requestId);
        await deleteDoc(docRef);
        return true;
      }
    };
  </script>

    // 전화번호 자동 하이픈 포맷터
    function formatPhoneNumber(raw) {
      const digits = String(raw || '').replace(/\D/g, '').slice(0, 11);
      if (digits.length < 4) return digits;
      if (digits.length < 8) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
      return `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7)}`;
    }

    // iframe 호환 클립보드 복사 함수
    function copyTextFallback(text) {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(textarea);
        return ok;
      } catch (e) {
        return false;
      }
    }

    function getTodayDateString() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

      // 상담 신청 목록 & 1:1 메시지 목록 (Firebase 실시간 동기화 + 로컬 메모리 백업)

      const [messages, setMessages] = useState([]);

      // 학생 상담 신청 폼 상태

        studentName: '',
        studentId: '',
        phone: '',
        category: '정서/마음',
        preferredDate: getTodayDateString(),
        preferredTime: '점심시간 (12:40 ~ 13:20)',
        content: ''
      });
      const [isSubmittingRequest, setIsSubmittingRequest] = useState(false);

      // 선생님 화면 필터 상태 ('ALL' | 'PENDING' | 'ACCEPTED' | 'COMPLETED')
      const [teacherFilter, setTeacherFilter] = useState('ALL');
      const [holdNoteModalReq, setHoldNoteModalReq] = useState(null);
      const [holdNoteText, setHoldNoteText] = useState('');

      // 1:1 실시간 채팅방 상태
      const [activeChatRequestId, setActiveChatRequestId] = useState(null);
      const [chatInput, setChatInput] = useState('');
      const isComposingRef = useRef(false);
      const messagesEndRef = useRef(null);

      // 토스트 알림
      const [toast, setToast] = useState(null);
      const showToast = (text, type = 'mint') => {
        setToast({ text, type });
        setTimeout(() => setToast(null), 3200);
      };

      // Firebase Firestore 실시간 구독 연결
      useEffect(() => {
        let unsubReq = () => {};
        let unsubMsg = () => {};

        if (window.__WEE_CLOUD__) {
          window.__WEE_CLOUD__.onReady(({ db, user }) => {
            if (db && user) {
              setCloudConnected(true);
              unsubReq = window.__WEE_CLOUD__.subscribeRequests((list) => {
                const sorted = [...list].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                setRequests(sorted);
              });
              unsubMsg = window.__WEE_CLOUD__.subscribeMessages((list) => {
                const sorted = [...list].sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                setMessages(sorted);
              });
            } else {
              setCloudConnected(false);
            }
          });
        }

        return () => {
          unsubReq();
          unsubMsg();
        };
      }, []);

      // 채팅방 새 메시지 수신 시 하단 스크롤
      useEffect(() => {
        if (activeChatRequestId && messagesEndRef.current) {
          messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [messages, activeChatRequestId]);

          studentId: sid,

          showToast(`🎓 학생 계정(${name} · ${sid})으로 전환했습니다.`, 'mint');

          setActiveChatRequestId(null);
          setRole('teacher');
          setShowRoleSwitchModal(false);
          showToast(`🌿 선생님 계정(${tName})으로 전환했습니다.`, 'mint');
        }
      };

      // 학생: 위클래스 상담 신청 제출
      const handleSubmitCounselingRequest = async (e) => {
        e.preventDefault();
        if (isSubmittingRequest) return;

        const studentName = applyForm.studentName.trim();
        const studentId = applyForm.studentId.trim();
        const phone = formatPhoneNumber(applyForm.phone);
        const content = applyForm.content.trim();

        if (!studentName || !studentId || phone.replace(/\D/g, '').length < 10) {
          showToast('학생 이름, 학번, 연락처(필수)를 정확히 입력해 주세요.', 'amber');
          return;
        }
        if (!content) {
          showToast('상담하고 싶은 내용을 간단히라도 적어 주세요.', 'amber');
          return;
        }

        setIsSubmittingRequest(true);
        const now = Date.now();
        const reqId = `wee-req-${now}-${Math.random().toString(36).slice(2, 6)}`;

        const newRequest = {
          id: reqId,
          studentName,
          studentId,
          phone,
          category: applyForm.category,
          preferredDate: applyForm.preferredDate,
          preferredTime: applyForm.preferredTime,
          content,
          status: 'PENDING', // 'PENDING' | 'ACCEPTED' | 'HOLD' | 'COMPLETED'
          teacherName: '',
          teacherNote: '',
          createdAt: now,
          updatedAt: now
        };

        try {
          if (cloudConnected && window.__WEE_CLOUD__) {
            await window.__WEE_CLOUD__.saveRequest(newRequest);
          } else {
            setRequests((prev) => [newRequest, ...prev]);
          }

          setStudentProfile({ name: studentName, studentId, phone });
          setApplyForm((prev) => ({ ...prev, content: '' }));
          setStudentActiveTab('list');
          showToast('✅ 위클래스 상담 신청이 선생님께 전송되었습니다!', 'mint');
        } catch (err) {
          console.error("상담 신청 저장 오류:", err);
          showToast('상담 신청 전송 중 오류가 발생했습니다. 다시 시도해 주세요.', 'rose');
        } finally {
          setIsSubmittingRequest(false);
        }
      };

      // 선생님: 상담 수락하기 -> 상태 'ACCEPTED' 변경 + 환영 메시지 생성 + 즉시 1:1 대화방 오픈
      const handleAcceptRequest = async (reqItem) => {
        const now = Date.now();
        const assignedTeacher = teacherProfile.name || '김민지 위클래스 선생님';
        const updates = {
          status: 'ACCEPTED',
          teacherName: assignedTeacher,
          acceptedAt: now,
          updatedAt: now
        };

        const welcomeMsg = {
          id: `wee-msg-${now}-${Math.random().toString(36).slice(2, 6)}`,
          requestId: reqItem.id,
          senderRole: 'system',
          senderName: '위클래스 안내',
          text: `🌿 ${assignedTeacher}이(가) 상담 신청을 수락했습니다. 1:1 실시간 대화가 시작되었습니다.`,
          timestamp: now
        };

        try {
          if (cloudConnected && window.__WEE_CLOUD__) {
            await window.__WEE_CLOUD__.updateRequest(reqItem.id, updates);
            await window.__WEE_CLOUD__.saveMessage(welcomeMsg);
          } else {
            setRequests((prev) =>
              prev.map((r) => (r.id === reqItem.id ? { ...r, ...updates } : r))
            );
            setMessages((prev) => [...prev, welcomeMsg]);
          }

          showToast(`✅ '${reqItem.studentName}' 학생의 상담을 수락하고 1:1 대화방을 열었습니다!`, 'mint');
          setActiveChatRequestId(reqItem.id);
        } catch (err) {
          console.error("상담 수락 처리 오류:", err);
          showToast('상담 수락 처리 중 오류가 발생했습니다.', 'rose');
        }
      };

      // 선생님: 보류/일정조율 처리
      const handleSaveHoldStatus = async (e) => {
        e.preventDefault();
        if (!holdNoteModalReq) return;
        const updates = {
          status: 'HOLD',
          teacherName: teacherProfile.name || '김민지 위클래스 선생님',
          teacherNote: holdNoteText.trim() || '일정 조율이 필요합니다. 연락처로 안내드리겠습니다.',
          updatedAt: Date.now()
        };

        try {
          if (cloudConnected && window.__WEE_CLOUD__) {
            await window.__WEE_CLOUD__.updateRequest(holdNoteModalReq.id, updates);
          } else {
            setRequests((prev) =>
              prev.map((r) => (r.id === holdNoteModalReq.id ? { ...r, ...updates } : r))
            );
          }
          showToast('⏸️ 보류 및 안내 메모가 학생에게 전달되었습니다.', 'amber');
          setHoldNoteModalReq(null);
          setHoldNoteText('');
        } catch (err) {
          console.error(err);
        }
      };

      // 선생님: 상담 완료 처리
      const handleCompleteCounseling = async (reqItem) => {
        const now = Date.now();
        const updates = {
          status: 'COMPLETED',
          completedAt: now,
          updatedAt: now
        };
        const endMsg = {
          id: `wee-msg-${now}-${Math.random().toString(36).slice(2, 6)}`,
          requestId: reqItem.id,
          senderRole: 'system',
          senderName: '위클래스 안내',
          text: `🌸 ${teacherProfile.name}이(가) 상담을 완료 처리했습니다. 언제든 다시 찾아와 주세요!`,
          timestamp: now
        };

        try {
          if (cloudConnected && window.__WEE_CLOUD__) {
            await window.__WEE_CLOUD__.updateRequest(reqItem.id, updates);
            await window.__WEE_CLOUD__.saveMessage(endMsg);
          } else {
            setRequests((prev) =>
              prev.map((r) => (r.id === reqItem.id ? { ...r, ...updates } : r))
            );
            setMessages((prev) => [...prev, endMsg]);
          }
          showToast('🌸 상담이 완료 처리되었습니다.', 'mint');
        } catch (err) {
          console.error(err);
        }
      };

      // 1:1 실시간 채팅 메시지 전송
      const handleSendChatMessage = async (e, presetText = null) => {
        if (e) e.preventDefault();
        if (isComposingRef.current) return;

        const rawText = presetText !== null ? presetText : chatInput;
        const text = rawText.trim();
        if (!text || !activeChatRequestId) return;

        const targetReq = requests.find((r) => r.id === activeChatRequestId);
        if (!targetReq || (targetReq.status !== 'ACCEPTED' && targetReq.status !== 'COMPLETED')) {
          showToast('선생님이 상담을 수락한 후 1:1 대화가 가능합니다.', 'amber');
          return;
        }

        if (presetText === null) setChatInput('');

        const now = Date.now();
        const newMsg = {
          id: `wee-msg-${now}-${Math.random().toString(36).slice(2, 6)}`,
          requestId: activeChatRequestId,
          senderRole: role, // 'student' | 'teacher'
          senderName: role === 'student'
            ? `${studentProfile.name} (${studentProfile.studentId})`
            : teacherProfile.name,
          text,
          timestamp: now
        };

        try {
          if (cloudConnected && window.__WEE_CLOUD__) {
            await window.__WEE_CLOUD__.saveMessage(newMsg);
          } else {
            setMessages((prev) => [...prev, newMsg]);
          }
        } catch (err) {
          console.error("메시지 전송 오류:", err);
          showToast('메시지 전송에 실패했습니다.', 'rose');
        }
      };

      // 테스트용 샘플 상담 신청 생성 (선생님 화면 확인용)
      const handleCreateDemoRequest = async () => {
        const now = Date.now();
        const demoReq = {
          id: `wee-req-${now}-demo`,
          studentName: '이하윤',
          studentId: '1학년 4반 08번',
          phone: '010-9876-5432',
          category: '교우관계',
          preferredDate: getTodayDateString(),
          preferredTime: '방과후 (16:30 ~ 17:10)',
          content: '새 학기 반 친구들과 친해지는 과정이 조금 어렵고 혼자 있는 시간이 많아 고민입니다. 선생님과 편하게 이야기 나누고 싶어요.',
          status: 'PENDING',
          teacherName: '',
          teacherNote: '',
          createdAt: now,
          updatedAt: now
        };
        try {
          if (cloudConnected && window.__WEE_CLOUD__) {
            await window.__WEE_CLOUD__.saveRequest(demoReq);
          } else {
            setRequests((prev) => [demoReq, ...prev]);
          }
          showToast('🌱 테스트용 학생 상담 신청이 도착했습니다!', 'mint');
        } catch (err) {
          console.error(err);
        }
      };

      // 현재 활성화된 채팅방의 신청 객체 및 메시지 목록
      const activeChatRequest = useMemo(
        () => requests.find((r) => r.id === activeChatRequestId) || null,
        [requests, activeChatRequestId]
      );

      const activeChatMessages = useMemo(
        () => messages.filter((m) => m.requestId === activeChatRequestId),
        [messages, activeChatRequestId]
      );

      // 학생 본인의 신청 내역 필터링 (학번/연락처/이름 일치 또는 전체 내역 중 본인 정보)
      const myStudentRequests = useMemo(() => {
        if (role !== 'student') return [];
        return requests.filter((r) => {
          const samePhone = r.phone && studentProfile.phone && r.phone.replace(/\D/g, '') === studentProfile.phone.replace(/\D/g, '');
          const sameNameAndId = r.studentName === studentProfile.name && r.studentId === studentProfile.studentId;
          return samePhone || sameNameAndId;
        });
      }, [requests, role, studentProfile]);

      // 선생님 통계 및 필터 목록
      const pendingRequestsCount = useMemo(
        () => requests.filter((r) => r.status === 'PENDING').length,
        [requests]
      );
      const acceptedRequestsCount = useMemo(
        () => requests.filter((r) => r.status === 'ACCEPTED').length,
        [requests]
      );
      const completedRequestsCount = useMemo(
        () => requests.filter((r) => r.status === 'COMPLETED').length,
        [requests]
      );

      const filteredTeacherRequests = useMemo(() => {
        if (teacherFilter === 'ALL') return requests;
        return requests.filter((r) => r.status === teacherFilter);
      }, [requests, teacherFilter]);

      // 상태 배지 렌더러
      const renderStatusBadge = (status) => {
        switch (status) {
          case 'PENDING':
            return (
              <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200">
                <Clock className="w-3.5 h-3.5" />
                승인 대기중
              </span>
            );
          case 'ACCEPTED':
            return (
              <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-mint-100 text-mint-800 border border-mint-200">
                <CheckCircle2 className="w-3.5 h-3.5" />
                수락됨 · 1:1 대화 활성
              </span>
            );
          case 'HOLD':
            return (
              <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-orange-100 text-orange-800 border border-orange-200">
                ⏸️ 보류 / 일정조율
              </span>
            );
          case 'COMPLETED':
            return (
              <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200">
                🌸 상담 완료
              </span>
            );
          default:
            return null;
        }
      };

      // =========================================================================
      // 1. 초기 로그인 및 계정 역할 선택 화면
      // =========================================================================
      if (role === 'none') {
        return (
          <div className="min-h-screen bg-gradient-to-b from-mint-50 via-beige-100 to-beige-200 flex items-center justify-center p-4">
            {toast && (
              <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-full text-xs font-bold shadow-lg flex items-center gap-2">
                <Sparkles className="w-4 h-4 text-mint-200" />
                <span>{toast.text}</span>
              </div>
            )}

            <div className="w-full max-w-md bg-white rounded-3xl shadow-xl border border-beige-200 overflow-hidden">
              {/* 상단 따뜻한 웰컴 헤더 */}
              <div className="bg-gradient-to-br from-mint-600 to-mint-700 p-6 text-white text-center space-y-2 relative">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/15 text-mint-50 text-[11px] font-bold">
                  <ShieldCheck className="w-3.5 h-3.5" />
                  <span>{cloudConnected ? '실시간 클라우드 동기화 연결됨' : '세션 모드 실행중'}</span>
                </div>
                <div className="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center mx-auto shadow-inner">
                  <HeartHandshake className="w-8 h-8 text-white" />
                </div>
                <h1 className="text-2xl font-extrabold tracking-tight">위클래스(Wee Class) 마음톡</h1>
                <p className="text-xs text-mint-100 leading-relaxed">
                  마음이 쉬어가는 우리 학교 상담실<br />
                  상담 신청부터 선생님 수락 후 1:1 대화까지 안전하게 연결됩니다.
                </p>
              </div>

              <div className="p-6 space-y-5">
                {/* 역할 선택 탭: 학생 계정 / 위클래스 선생님 계정 */}
                <div className="grid grid-cols-2 gap-2 p-1.5 bg-beige-100 rounded-2xl border border-beige-200">
                  <button
                    type="button"
                    onClick={() => setLoginTab('student')}
                    className={`py-3 px-3 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 transition ${
                      loginTab === 'student'
                        ? 'bg-white text-mint-800 shadow-sm border border-mint-200'
                        : 'text-slate-500 hover:text-slate-800'
                    }`}
                  >
                    <GraduationCap className="w-4 h-4 text-mint-600" />
                    <span>학생 계정</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => setLoginTab('teacher')}
                    className={`py-3 px-3 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 transition ${
                      loginTab === 'teacher'
                        ? 'bg-white text-mint-800 shadow-sm border border-mint-200'
                        : 'text-slate-500 hover:text-slate-800'
                    }`}
                  >
                    <HeartHandshake className="w-4 h-4 text-mint-600" />
                    <span>위클래스 선생님 계정</span>
                  </button>
                </div>

                {/* 학생 로그인 폼 */}
                {loginTab === 'student' ? (
                  <form onSubmit={handleStudentLogin} className="space-y-3.5">

                      <span className="text-xs font-extrabold text-slate-700">학생 정보 입력</span>
                      <button
                        type="button"

                          setStudentProfile({

                          })

                        className="text-[11px] font-bold text-mint-700 bg-mint-50 hover:bg-mint-100 px-2.5 py-1 rounded-lg border border-mint-200 transition"
                      >

                      </button>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">이름</label>
                      <input

                      <label className="block text-xs font-bold text-slate-600 mb-1">연락처 (전화번호)</label>

                        value={studentProfile.phone}

                          setStudentProfile({ ...studentProfile, phone: formatPhoneNumber(e.target.value) })

                        placeholder="예: 010-1234-5678"
                        className="w-full bg-beige-50 border border-beige-200 rounded-xl px-3.5 py-2.5 text-sm font-mono font-semibold focus:outline-none focus:border-mint-600"
                        required
                      />

                    <button
                      type="submit"

                    >

                  </form>
                ) : (
                  /* 위클래스 선생님 로그인 폼 */
                  <form onSubmit={handleTeacherLogin} className="space-y-4">

                      <p className="font-extrabold">🌿 위클래스 전문상담교사 전용 모드</p>

                        학생들이 보낸 상담 신청 내역과 연락처를 실시간으로 확인하고, 상담을 수락해 1:1 대화를 진행할 수 있습니다.
                      </p>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">위클래스 선생님 성함</label>
                      <input
                        type="text"
                        value={teacherProfile.name}
                        onChange={(e) => setTeacherProfile({ name: e.target.value })}
                        placeholder="예: 김민지 위클래스 선생님"
                        className="w-full bg-beige-50 border border-beige-200 rounded-xl px-3.5 py-2.5 text-sm font-bold focus:outline-none focus:border-mint-600"
                        required
                      />
                    </div>

                    <button
                      type="submit"

                    >
                      🌿 위클래스 선생님 계정으로 접속하기
                    </button>
                  </form>
                )}
              </div>
            </div>
          </div>
        );
      }

      // =========================================================================
      // 2. 로그인 이후 메인 화면 (상단 역할 전환 바 + 채팅방 / 학생 화면 / 선생님 화면)
      // =========================================================================
      return (
        <div className="min-h-screen bg-beige-100 flex justify-center">
          <div className="w-full max-w-lg bg-beige-50 min-h-screen flex flex-col shadow-xl border-x border-beige-200 relative">
            {/* 토스트 알림 */}
            {toast && (
              <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-full text-xs font-bold shadow-xl flex items-center gap-2 max-w-[92vw]">
                <Sparkles className="w-4 h-4 text-mint-200 shrink-0" />
                <span className="truncate">{toast.text}</span>
              </div>
            )}

            {/* 상단 글로벌 헤더 & 역할 전환 바 */}
            <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-beige-200 px-4 py-3 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2.5 min-w-0">
                <div className="w-9 h-9 rounded-xl bg-mint-600 text-white flex items-center justify-center shrink-0 shadow-sm">
                  <HeartHandshake className="w-5 h-5" />
                </div>
                <div className="min-w-0">
                  <div className="flex items-center gap-1.5">
                    <h1 className="font-extrabold text-sm text-slate-900 truncate">위클래스 마음톡</h1>
                    <span
                      className={`text-[10px] font-extrabold px-1.5 py-0.5 rounded-full shrink-0 ${
                        cloudConnected
                          ? 'bg-mint-100 text-mint-800'
                          : 'bg-amber-100 text-amber-800'
                      }`}
                    >
                      {cloudConnected ? '● 실시간' : '● 세션'}
                    </span>
                  </div>
                  <p className="text-[11px] font-bold text-mint-700 truncate">
                    {role === 'student'
                      ? `🎓 ${studentProfile.name} (${studentProfile.studentId})`
                      : `🌿 ${teacherProfile.name}`}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-1.5 shrink-0">
                <button
                  type="button"
                  onClick={() => {
                    setSwitchTab(role === 'student' ? 'teacher' : 'student');
                    setShowRoleSwitchModal(true);
                  }}
                  className="px-3 py-2 rounded-xl bg-mint-50 hover:bg-mint-100 text-mint-800 border border-mint-200 text-xs font-extrabold flex items-center gap-1 transition shadow-sm"
                >
                  <RefreshCw className="w-3.5 h-3.5 text-mint-600" />
                  <span>{role === 'student' ? '선생님 전환' : '학생 전환'}</span>
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setActiveChatRequestId(null);
                    setRole('none');
                  }}
                  title="초기 로그인 화면으로"
                  className="p-2 rounded-xl bg-beige-100 hover:bg-beige-200 text-slate-600 text-xs font-bold transition"
                >
                  <X className="w-4 h-4" />
                </button>
              </div>
            </header>

            {/* =================================================================
                A. 1:1 실시간 상담 대화방 (수락된 신청 건 입장 시)
               ================================================================= */}

                    <p className="text-sm font-extrabold text-slate-800">해당 상태의 상담 신청이 없습니다</p>
                    <p className="text-xs text-slate-500">
                      학생 계정에서 상담을 신청하면 이곳에 연락처와 신청 내역이 실시간으로 표시됩니다.
                    </p>
                  </div>
                ) : (
                  <div className="space-y-3">
                    {filteredTeacherRequests.map((req) => {
                      const msgCount = messages.filter((m) => m.requestId === req.id && m.senderRole !== 'system').length;
                      const createdTime = new Date(req.createdAt || Date.now()).toLocaleString('ko-KR', {
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                      });

                      return (
                        <div
                          key={req.id}
                          className={`bg-white rounded-3xl p-4 border shadow-sm space-y-3 ${
                            req.status === 'PENDING'
                              ? 'border-amber-300 ring-2 ring-amber-200/50'
                              : req.status === 'ACCEPTED'
                              ? 'border-mint-400'
                              : 'border-beige-200'
                          }`}
                        >
                          {/* 상단: 학생 이름/학번 + 상태 배지 */}
                          <div className="flex items-start justify-between gap-2">
                            <div>
                              <div className="flex items-center gap-1.5 flex-wrap">
                                <h3 className="font-extrabold text-base text-slate-900">
                                  {req.studentName}
                                </h3>
                                <span className="text-xs font-bold px-2 py-0.5 rounded-lg bg-beige-100 text-slate-700">
                                  {req.studentId}
                                </span>
                              </div>
                              <p className="text-[11px] text-slate-400 mt-0.5">신청 접수: {createdTime}</p>
                            </div>
                            {renderStatusBadge(req.status)}
                          </div>

                          {/* 학생 연락처 강조 카드 (전화/문자/복사) */}
                          <div className="p-3 rounded-2xl bg-mint-50 border border-mint-200 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2 min-w-0">
                              <div className="w-8 h-8 rounded-xl bg-mint-600 text-white flex items-center justify-center shrink-0">
                                <Phone className="w-4 h-4" />
                              </div>
                              <div className="min-w-0">
                                <p className="text-[10px] font-extrabold text-mint-800">학생 연락처 (즉시 연락 가능)</p>
                                <p className="text-sm font-mono font-black text-slate-900 truncate">{req.phone}</p>
                              </div>
                            </div>

                            <div className="flex items-center gap-1 shrink-0">
                              <a
                                href={`tel:${req.phone}`}
                                className="px-2.5 py-1.5 rounded-xl bg-mint-600 hover:bg-mint-700 text-white text-[11px] font-extrabold transition"
                              >
                                전화
                              </a>
                              <a
                                href={`sms:${req.phone}`}
                                className="px-2.5 py-1.5 rounded-xl bg-white hover:bg-beige-100 text-mint-800 border border-mint-200 text-[11px] font-extrabold transition"
                              >
                                문자
                              </a>
                              <button
                                type="button"
                                onClick={() => {
                                  copyTextFallback(req.phone);
                                  showToast(`📋 ${req.studentName} 학생 연락처(${req.phone}) 복사 완료!`);
                                }}
                                className="p-1.5 rounded-xl bg-white hover:bg-beige-100 text-slate-600 border border-beige-200 transition"
                                title="연락처 복사"
                              >
                                <Copy className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>

                          {/* 상담 분야, 희망 일시, 상담 내용 */}
                          <div className="p-3 rounded-2xl bg-beige-50 border border-beige-200/80 space-y-1.5 text-xs">
                            <div className="flex items-center justify-between flex-wrap gap-1">
                              <span className="font-extrabold text-mint-800">분야: {req.category}</span>
                              <span className="font-bold text-slate-600 flex items-center gap-1">
                                <Calendar className="w-3.5 h-3.5 text-slate-400" />
                                {req.preferredDate} · {req.preferredTime}
                              </span>
                            </div>
                            <p className="text-slate-800 leading-relaxed pt-1 border-t border-beige-200/70">
                              {req.content}
                            </p>
                          </div>

                          {/* 선생님 액션 버튼 영역 */}
                          {req.status === 'PENDING' && (
                            <div className="flex gap-2 pt-1">
                              <button
                                type="button"
                                onClick={() => handleAcceptRequest(req)}
                                className="flex-1 py-3 bg-mint-600 hover:bg-mint-700 text-white font-extrabold rounded-2xl text-xs shadow-sm transition flex items-center justify-center gap-1.5"
                              >
                                <CheckCircle2 className="w-4 h-4" />
                                <span>상담 수락하기 (1:1 대화 열기)</span>
                              </button>
                              <button
                                type="button"
                                onClick={() => {
                                  setHoldNoteModalReq(req);
                                  setHoldNoteText('');
                                }}
                                className="px-3.5 py-3 bg-beige-100 hover:bg-beige-200 text-slate-700 font-extrabold rounded-2xl text-xs transition"
                              >
                                보류/조율
                              </button>
                            </div>
                          )}

                          {req.status === 'HOLD' && (
                            <div className="space-y-2">
                              <p className="text-[11px] text-orange-800 bg-orange-50 px-3 py-2 rounded-xl border border-orange-200">
                                ⏸️ 보류 메모: {req.teacherNote}
                              </p>
                              <button
                                type="button"
                                onClick={() => handleAcceptRequest(req)}
                                className="w-full py-2.5 bg-mint-600 hover:bg-mint-700 text-white font-extrabold rounded-2xl text-xs transition"
                              >
                                ✅ 지금 상담 수락하기
                              </button>
                            </div>
                          )}

                          {(req.status === 'ACCEPTED' || req.status === 'COMPLETED') && (
                            <div className="flex gap-2 pt-1">
                              <button
                                type="button"
                                onClick={() => setActiveChatRequestId(req.id)}
                                className="flex-1 py-3 bg-mint-700 hover:bg-mint-800 text-white font-extrabold rounded-2xl text-xs shadow-sm flex items-center justify-center gap-1.5 transition"
                              >
                                <MessageCircle className="w-4 h-4" />
                                <span>1:1 상담 대화 입장</span>
                                {msgCount > 0 && (
                                  <span className="px-2 py-0.5 rounded-full bg-white/20 text-[10px] font-black">
                                    {msgCount}
                                  </span>
                                )}
                              </button>
                              {req.status === 'ACCEPTED' && (
                                <button
                                  type="button"
                                  onClick={() => handleCompleteCounseling(req)}
                                  className="px-3.5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold rounded-2xl text-xs transition"
                                >
                                  완료 처리
                                </button>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* =================================================================
                모달 1: 상단 바 빠른 역할 전환 모달 (학생 ↔ 위클래스 선생님)
               ================================================================= */}
            {showRoleSwitchModal && (
              <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl border border-beige-200">
                  <div className="flex items-center justify-between border-b border-beige-200 pb-3">
                    <h3 className="font-extrabold text-sm text-slate-900">계정 역할 빠른 전환</h3>
                    <button
                      type="button"
                      onClick={() => setShowRoleSwitchModal(false)}
                      className="p-1 text-slate-400 hover:text-slate-700"
                    >
                      <X className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="grid grid-cols-2 gap-1.5 p-1 bg-beige-100 rounded-2xl">
                    <button
                      type="button"
                      onClick={() => setSwitchTab('student')}
                      className={`py-2.5 rounded-xl text-xs font-extrabold transition ${
                        switchTab === 'student'
                          ? 'bg-white text-mint-800 shadow-sm'
                          : 'text-slate-500'
                      }`}
                    >
                      🎓 학생 계정
                    </button>
                    <button
                      type="button"
                      onClick={() => setSwitchTab('teacher')}
                      className={`py-2.5 rounded-xl text-xs font-extrabold transition ${
                        switchTab === 'teacher'
                          ? 'bg-white text-mint-800 shadow-sm'
                          : 'text-slate-500'
                      }`}
                    >
                      🌿 위클래스 선생님
                    </button>
                  </div>

                  <form onSubmit={handleExecuteRoleSwitch} className="space-y-3">
                    {switchTab === 'student' ? (
                      <>
                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">학생 이름</label>
                          <input
                            type="text"
                            value={switchStudentForm.name}
                            onChange={(e) => setSwitchStudentForm({ ...switchStudentForm, name: e.target.value })}
                            className="w-full bg-beige-50 border border-beige-200 rounded-xl px-3 py-2 text-xs font-bold"
                            required
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">학번</label>
                          <input
                            type="text"
                            value={switchStudentForm.studentId}
                            onChange={(e) => setSwitchStudentForm({ ...switchStudentForm, studentId: e.target.value })}
                            className="w-full bg-beige-50 border border-beige-200 rounded-xl px-3 py-2 text-xs font-bold"
                            required
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">연락처</label>
                          <input
                            type="tel"
                            value={switchStudentForm.phone}
                            onChange={(e) =>
                              setSwitchStudentForm({ ...switchStudentForm, phone: formatPhoneNumber(e.target.value) })
                            }
                            className="w-full bg-beige-50 border border-beige-200 rounded-xl px-3 py-2 text-xs font-mono font-bold"
                            required
                          />
                        </div>
                      </>
                    ) : (
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">위클래스 선생님 성함</label>
                        <input
                          type="text"
                          value={switchTeacherName}
                          onChange={(e) => setSwitchTeacherName(e.target.value)}
                          className="w-full bg-beige-50 border border-beige-200 rounded-xl px-3 py-2.5 text-xs font-bold"
                          required
                        />
                      </div>
                    )}

                    <button
                      type="submit"
                      className="w-full py-3 bg-mint-600 hover:bg-mint-700 text-white font-extrabold rounded-2xl text-xs shadow transition"
                    >
                      선택한 역할로 즉시 전환하기
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* =================================================================
                모달 2: 선생님 보류/일정조율 메모 모달
               ================================================================= */}
            {holdNoteModalReq && (
              <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
                <form
                  onSubmit={handleSaveHoldStatus}
                  className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl border border-beige-200"
                >
                  <div className="flex items-center justify-between border-b border-beige-200 pb-3">
                    <h3 className="font-extrabold text-sm text-slate-900">
                      ⏸️ 상담 보류 및 일정 조율 안내
                    </h3>
                    <button
                      type="button"
                      onClick={() => setHoldNoteModalReq(null)}
                      className="p-1 text-slate-400"
                    >
                      <X className="w-5 h-5" />
                    </button>
                  </div>

                  <p className="text-xs text-slate-600">
                    <b>{holdNoteModalReq.studentName} ({holdNoteModalReq.studentId})</b> 학생에게 전달할 일정 안내 메시지를 입력하세요.
                  </p>

                  <textarea
                    rows="3"
                    value={holdNoteText}
                    onChange={(e) => setHoldNoteText(e.target.value)}
                    placeholder="예: 해당 시간에는 외부 출장이 있어 내일 점심시간(12:40)에 진행할게요!"
                    className="w-full bg-beige-50 border border-beige-200 rounded-2xl p-3 text-xs focus:outline-none focus:border-mint-600"
                    required
                  />

                  <button
                    type="submit"
                    className="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-extrabold rounded-2xl text-xs shadow transition"
                  >
                    안내 메모 저장 및 전송
                  </button>
                </form>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
